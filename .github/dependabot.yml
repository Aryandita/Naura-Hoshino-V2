version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Jangan update discord.js secara otomatis tanpa review
      - dependency-name: "discord.js"
        versions:
          - "> 14.x"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
