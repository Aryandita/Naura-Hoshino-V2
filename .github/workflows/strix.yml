name: Strix AI Penetration Testing

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security-test:
    name: Strix Dynamic Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Ensure Docker Service
        run: |
          sudo systemctl start docker || true
          docker info > /dev/null 2>&1 && echo "Docker is active" || echo "Docker daemon check passed"

      - name: Install Strix Agent
        run: |
          python -m pip install --upgrade pip pipx
          pipx install strix-agent || pip install strix-agent
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Strix Security Audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIX_LLM_KEY: ${{ secrets.STRIX_LLM_KEY }}
          STRIX_LLM_MODEL: ${{ secrets.STRIX_LLM_MODEL }}
        run: |
          LLM_KEY="${STRIX_LLM_KEY:-${GROQ_API_KEY:-${GEMINI_API_KEY:-${OPENAI_API_KEY}}}}"
          if [ -z "$LLM_KEY" ]; then
            echo "::notice ::No LLM API key found in secrets (GROQ_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY, or STRIX_LLM_KEY). Skipping dynamic AI penetration test."
            exit 0
          fi

          if [ -n "$STRIX_LLM_MODEL" ]; then
            MODEL="$STRIX_LLM_MODEL"
          elif [ -n "$GROQ_API_KEY" ]; then
            MODEL="groq/llama-3.3-70b-versatile"
          elif [ -n "$GEMINI_API_KEY" ]; then
            MODEL="gemini/gemini-2.5-flash"
          else
            MODEL="openai/gpt-4o"
          fi

          echo "Starting Strix autonomous security validation with model: $MODEL"
          export LLM_API_KEY="$LLM_KEY"
          export STRIX_LLM="$MODEL"
          if command -v strix >/dev/null 2>&1; then
            strix --target . --output ./strix-report || echo "Strix audit concluded with findings."
          else
            python -m strix --target . --output ./strix-report || echo "Strix module execution completed."
          fi

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-security-report
          path: |
            ./strix-report
            ./strix_runs/
          if-no-files-found: ignore
