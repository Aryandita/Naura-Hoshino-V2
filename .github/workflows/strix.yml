name: Strix AI Penetration Testing

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security-test:
    name: Strix Dynamic Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Strix
        run: |
          pip install --upgrade pip
          pip install strix-agent || echo "Strix pip package installed"

      - name: Run Strix Security Audit
        if: ${{ secrets.STRIX_LLM_KEY != '' || secrets.OPENAI_API_KEY != '' }}
        env:
          LLM_API_KEY: ${{ secrets.STRIX_LLM_KEY || secrets.OPENAI_API_KEY }}
          STRIX_LLM: ${{ secrets.STRIX_LLM_MODEL || 'openai/gpt-4o' }}
        run: |
          echo "Starting Strix autonomous security validation..."
          strix --target . --output ./strix-report || true

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-security-report
          path: ./strix_runs/
          if-no-files-found: ignore

      - name: Skip Notification
        if: ${{ secrets.STRIX_LLM_KEY == '' && secrets.OPENAI_API_KEY == '' }}
        run: echo "No LLM API key secret found for Strix (set STRIX_LLM_KEY or OPENAI_API_KEY in repository Secrets). Skipping scan."
