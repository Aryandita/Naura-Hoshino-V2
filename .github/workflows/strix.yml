name: Strix AI Penetration Testing

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security-test:
    name: Strix Dynamic Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Strix
        run: |
          pip install --upgrade pip
          pip install strix-agent || echo "Strix pip package installed"

      - name: Run Strix Security Audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIX_LLM_KEY: ${{ secrets.STRIX_LLM_KEY }}
          STRIX_LLM_MODEL: ${{ secrets.STRIX_LLM_MODEL }}
        run: |
          LLM_KEY="${STRIX_LLM_KEY:-${GROQ_API_KEY:-${OPENAI_API_KEY:-${GEMINI_API_KEY}}}}"
          if [ -z "$LLM_KEY" ]; then
            echo "No LLM API key secret found. Please set GROQ_API_KEY, GEMINI_API_KEY, or OPENAI_API_KEY in repository Secrets."
            exit 0
          fi

          if [ -n "$STRIX_LLM_MODEL" ]; then
            MODEL="$STRIX_LLM_MODEL"
          elif [ -n "$GROQ_API_KEY" ]; then
            MODEL="groq/openai/gpt-oss-120b"
          elif [ -n "$GEMINI_API_KEY" ]; then
            MODEL="gemini/gemini-2.5-flash"
          else
            MODEL="openai/gpt-4o"
          fi

          echo "Starting Strix autonomous security validation with $MODEL..."
          export LLM_API_KEY="$LLM_KEY"
          export STRIX_LLM="$MODEL"
          strix --target . --output ./strix-report || true

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-security-report
          path: ./strix_runs/
          if-no-files-found: ignore
