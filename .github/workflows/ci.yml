name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check
        # continue-on-error is deliberately removed

      - name: ESLint
        run: npm run lint
        # continue-on-error is deliberately removed

  test:
    name: Unit Tests & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Check Locales
        run: npm run locales:check:strict

      - name: Check Module Resolution
        run: node scripts/check-requires.js

      - name: Security Audit
        run: npm audit --audit-level=high
        # continue-on-error is deliberately removed
