name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, Test & Locale Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Cek em dash terlarang
        run: node scripts/check-em-dash.js
      - name: Audit paritas kunci bahasa (ID vs EN)
        run: npm run locales:check:strict
      - name: Test
        run: npm test
      - name: Cek resolusi modul internal (Boot check)
        run: node scripts/check-requires.js
      - name: Cek format Prettier
        run: npm run format:check

  security:
    name: Audit Keamanan Dependensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm audit
        run: npm audit --audit-level=high
