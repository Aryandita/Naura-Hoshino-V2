name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint & Locale Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --ignore-scripts: hindari build native (canvas, sqlite3, ffmpeg) yang tidak
      # dibutuhkan untuk lint dan sangat lambat di CI.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Audit paritas kunci bahasa (ID vs EN)
        run: npm run locales:check

      - name: Cek format Prettier
        run: npm run format:check
        continue-on-error: true
