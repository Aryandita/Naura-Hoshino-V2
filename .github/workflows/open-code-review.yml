name: OpenCodeReview PR Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: AI Automated Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Run Code Review
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          TOKEN="${OCR_LLM_TOKEN:-${OPENAI_API_KEY:-${GROQ_API_KEY}}}"
          if [ -z "$TOKEN" ]; then
            echo "No LLM token found (set GROQ_API_KEY, OPENAI_API_KEY, or OCR_LLM_TOKEN in repository Secrets). Skipping automated review."
            exit 0
          fi

          URL="${OCR_LLM_URL}"
          MODEL="${OCR_LLM_MODEL}"

          if [ -z "$URL" ]; then
            if [ -n "$GROQ_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$OCR_LLM_TOKEN" ]; then
              URL="https://api.groq.com/openai/v1"
            else
              URL="https://api.openai.com/v1"
            fi
          fi

          if [ -z "$MODEL" ]; then
            if [ -n "$GROQ_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$OCR_LLM_TOKEN" ]; then
              MODEL="openai/gpt-oss-120b"
            else
              MODEL="gpt-4o"
            fi
          fi

          ocr config set llm.url "$URL"
          ocr config set llm.auth_token "$TOKEN"
          ocr config set llm.model "$MODEL"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ocr scan --path src,plugin,dashboard/server.js --audience agent
          else
            ocr review --audience agent --background "Naura Hoshino V2: Discord bot and Web Dashboard ecosystem. Ensure clean code, high security, atomic DB transactions, no em-dashes, and strict syntax integrity."
          fi
