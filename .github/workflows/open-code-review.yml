name: OpenCodeReview PR Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: AI Automated Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Run Code Review
        if: ${{ secrets.OCR_LLM_TOKEN != '' || secrets.GROQ_API_KEY != '' || secrets.OPENAI_API_KEY != '' }}
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN || secrets.OPENAI_API_KEY || secrets.GROQ_API_KEY }}
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL || (secrets.GROQ_API_KEY != '' && secrets.OPENAI_API_KEY == '' && secrets.OCR_LLM_TOKEN == '' && 'https://api.groq.com/openai/v1') || 'https://api.openai.com/v1' }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL || (secrets.GROQ_API_KEY != '' && secrets.OPENAI_API_KEY == '' && secrets.OCR_LLM_TOKEN == '' && 'openai/gpt-oss-120b') || 'gpt-4o' }}
        run: |
          ocr config set llm.url "$OCR_LLM_URL"
          ocr config set llm.auth_token "$OCR_LLM_TOKEN"
          ocr config set llm.model "$OCR_LLM_MODEL"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ocr scan --path src,plugin,dashboard/server.js --audience agent
          else
            ocr review --audience agent --background "Naura Hoshino V2: Discord bot and Web Dashboard ecosystem. Ensure clean code, high security, atomic DB transactions, no em-dashes, and strict syntax integrity."
          fi

      - name: Skip Notification
        if: ${{ secrets.OCR_LLM_TOKEN == '' && secrets.GROQ_API_KEY == '' && secrets.OPENAI_API_KEY == '' }}
        run: echo "No LLM token found (set GROQ_API_KEY, OPENAI_API_KEY, or OCR_LLM_TOKEN in repository Secrets). Skipping automated review."
