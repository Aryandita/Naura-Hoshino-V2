name: OpenCodeReview PR Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: AI Automated Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OpenCodeReview
        run: |
          npm install -g @alibaba-group/open-code-review || echo "Failed to install globally, will try npx"

      - name: Run Code Review
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          TOKEN="${OCR_LLM_TOKEN:-${GROQ_API_KEY:-${OPENAI_API_KEY}}}"
          if [ -z "$TOKEN" ]; then
            echo "::notice ::No LLM token secret configured (GROQ_API_KEY, OPENAI_API_KEY, or OCR_LLM_TOKEN). Skipping automated PR review."
            exit 0
          fi

          URL="${OCR_LLM_URL}"
          MODEL="${OCR_LLM_MODEL}"

          if [ -z "$URL" ]; then
            if [ -n "$GROQ_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$OCR_LLM_TOKEN" ]; then
              URL="https://api.groq.com/openai/v1"
            else
              URL="https://api.openai.com/v1"
            fi
          fi

          if [ -z "$MODEL" ]; then
            if [ -n "$GROQ_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$OCR_LLM_TOKEN" ]; then
              MODEL="llama-3.3-70b-versatile"
            else
              MODEL="gpt-4o"
            fi
          fi

          echo "Configuring OCR with URL: $URL and Model: $MODEL"
          if command -v ocr >/dev/null 2>&1; then
            ocr config set llm.url "$URL" || true
            ocr config set llm.auth_token "$TOKEN" || true
            ocr config set llm.model "$MODEL" || true

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              ocr scan --path src,plugin,dashboard/server.js --audience agent || echo "OCR scan finished with notices."
            else
              ocr review --audience agent --background "Naura Hoshino V2: Discord bot and Web Dashboard ecosystem. Ensure clean code, high security, atomic DB transactions, no em-dashes, and strict syntax integrity." || echo "OCR review finished."
            fi
          else
            echo "::notice ::ocr binary not in PATH; skipping review."
          fi
