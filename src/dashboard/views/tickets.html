<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Tiket - Naura Hoshino</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0B0C10;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #FFB6C1; text-align: center; }
        .ticket-list {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .ticket-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }
        .ticket-card:hover { transform: translateY(-2px); }
        .ticket-info h3 { margin: 0 0 5px 0; color: #F9A8D4; }
        .ticket-info p { margin: 0; font-size: 0.9em; color: #aaa; }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .badge.open { background: #10B981; color: #fff; }
        .badge.closed { background: #4B5563; color: #fff; }
        .btn {
            background: #5865F2;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #4752C4; }
        .btn[disabled] { background: #374151; cursor: not-allowed; }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #FFB6C1;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn">← Kembali ke Dashboard</a>
    <h1>Riwayat Tiket</h1>
    <div class="ticket-list" id="ticketList">
        <p style="text-align: center; color: #aaa;">Memuat tiket...</p>
    </div>

    <script>
        async function fetchTickets() {
            try {
                const res = await fetch('/api/tickets/me');
                if (!res.ok) throw new Error('Gagal mengambil data');
                const data = await res.json();
                
                const list = document.getElementById('ticketList');
                list.innerHTML = '';
                
                if (data.tickets.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #aaa;">Kamu belum pernah membuat tiket apapun.</p>';
                    return;
                }
                
                data.tickets.forEach(ticket => {
                    const date = new Date(ticket.createdAt).toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                    
                    let actionButton = '';
                    if (ticket.status === 'closed' && ticket.transcriptPath) {
                        actionButton = `<a href="${ticket.transcriptPath}" class="btn" target="_blank">Lihat Transkrip</a>`;
                    } else if (ticket.status === 'open') {
                        actionButton = `<button class="btn" disabled>Sedang Berjalan</button>`;
                    }
                    
                    list.innerHTML += `
                        <div class="ticket-card">
                            <div class="ticket-info">
                                <h3>${ticket.topic}</h3>
                                <p>Server: ${ticket.guildName}</p>
                                <p>Dibuat: ${date}</p>
                            </div>
                            <div style="text-align: right;">
                                <div style="margin-bottom: 10px;">
                                    <span class="badge ${ticket.status}">${ticket.status.toUpperCase()}</span>
                                </div>
                                ${actionButton}
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('ticketList').innerHTML = '<p style="text-align: center; color: #EF4444;">Terjadi kesalahan saat memuat tiket.</p>';
            }
        }
        
        fetchTickets();
    </script>
</body>
</html>
