<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Filter Bayangan Halus untuk Latar Putih Bersih -->
    <filter id="itemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>

    <!-- Filter Glow Berwarna Halus Sesuai Tier -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#93C5FD" flood-opacity="0.45" />
    </filter>

    <!-- Gradien Bilah Senjata -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Gradien Zirah -->
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Gradien Ramuan -->
    <linearGradient id="potionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Gradien Permata -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gradien Bola Inti -->
    <radialGradient id="orbGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>

  <!-- Latar Belakang Putih Polos Murni -->
  <rect x="0" y="0" width="128" height="128" rx="16" fill="#ffffff" />

  <!-- Bingkai Halus dengan Aksen Warna Tier -->
  <rect x="2.5" y="2.5" width="123" height="123" rx="14" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Bayangan Ambien Halus di Bawah Objek -->
  <ellipse cx="64" cy="116" rx="28" ry="4" fill="#000000" opacity="0.06" />

  <!-- Vektor Karya Seni Item Spesifik (Di-wrap dengan filter shadow halus) -->
  <g id="itemArt" filter="url(#itemShadow)">
    
      <!-- Tombak & Trident -->
      <line x1="64" y1="42" x2="64" y2="114" stroke="#4a5568" stroke-width="4" stroke-linecap="round" />
      <path d="M64 16 L74 42 L64 38 L54 42 Z" fill="url(#bladeGrad)" stroke="#93C5FD" stroke-width="2" filter="url(#glowFilter)" />
      <path d="M48 28 L54 44 L48 42 Z" fill="#93C5FD" opacity="0.8" />
      <path d="M80 28 L74 44 L80 42 Z" fill="#93C5FD" opacity="0.8" />
      <circle cx="64" cy="46" r="3" fill="#ffffff" />
    
  </g>

  <!-- Indikator Angka Tier Romawi di Sudut Kiri Atas -->
  <g id="tierBadge" transform="translate(8, 8)">
    <rect x="0" y="0" width="22" height="15" rx="4" fill="#ffffff" stroke="#93C5FD" stroke-width="1.2" />
    <text x="11" y="11" font-family="'Orbitron', 'Outfit', sans-serif" font-size="8" font-weight="800" fill="#93C5FD" text-anchor="middle">
      III
    </text>
  </g>

  <!-- Watermark Huruf 'N' Resmi Naura Hoshino di Sudut Kanan Bawah -->
  <g id="watermarkN" transform="translate(98, 98)">
    <circle cx="12" cy="12" r="11" fill="#ffffff" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.85" />
    <text x="12" y="16.5" font-family="'Orbitron', 'Outfit', sans-serif" font-size="11" font-weight="900" fill="#93C5FD" text-anchor="middle" opacity="0.9">N</text>
  </g>
</svg>
