# Konfigurasi Lavalink v4 untuk container Naura Hoshino (docker-compose).
# File ini di-mount ke /opt/Lavalink/application.yml oleh docker-compose.yml.
#
# Plugin yang dipakai:
#   - youtube-source : sumber YouTube modern dengan rotasi client InnerTube.
#   - LavaSrc        : resolusi native link Spotify, lyrics, + source yt-dlp.
#
# FIX YOUTUBE BOT DETECTION (3 LAPIS, 2026-10-28):
#   LAPIS 1 - PO TOKEN: provider bgutil (pot-server:4416) dipakai plugin
#             yt-dlp bgutil-ytdlp-pot-provider untuk membuktikan request
#             bukan bot. Tanpa lapis ini, IP datacenter sering diblokir
#             YouTube ("Sign in to confirm you're not a bot").
#   LAPIS 2 - CLIENT ROTATION: gunakan client InnerTube non-default yang belum
#             diblokir (MUSIC, WEBEMBEDDED, ANDROID_VR, TVHTML5_SIMPLY)
#             secara berurutan; jika satu gagal, client berikutnya mencoba.
#   LAPIS 3 - YT-DLP SEBAGAI SUMBER UTAMA: source "ytdlp" LavaSrc memanggil
#             binary yt-dlp (pemakai PO token) sebagai jalur pencarian utama
#             (prefix "ytsearch:"), menggantikan client InnerTube default.
#
# Catatan versi: cek halaman Releases kedua repo secara berkala dan naikkan
# patch version-nya; koordinat group:artifact tidak berubah antar patch.

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-v2:1.13.0"
      snapshot: false
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      snapshot: false
      repository: "https://maven.lavalink.dev/releases"
  server:
    port: 2333
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    http2:
      enabled: false # Bila true, Poru/node harus mendukung HTTP/2
    sources:
      # Semua source bawaan non-YouTube tetap aktif (soundcloud, bandcamp, dll.)
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true # warning: tanpa proxy, ini bisa membocorkan IP node
      local: false
      # YouTube bawaan dimatikan; digantikan gabungan youtube-source + ytdlp.
      youtube: false
    youtubePlaylistLoadLimit: 6

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # LAPIS 2 - CLIENT ROTATION.
    # Urutan penanganan: client pertama dicoba dulu, lalu berikutnya.
    # MUSIC       : satu-satunya client pencarian YouTube Music (ytmsearch:).
    # WEBEMBEDDED : pemutar web embedded, paling tahan deteksi bot.
    # ANDROID_VR  : client Android VR, tidak terdeteksi bot sejauh ini.
    # TVHTML5_SIMPLY: client TV ringan, pengganti TVHTML5EMBEDDED (EOL).
    # TV_DOWNLOADED bukan client valid di youtube-source; tidak dipakai.
    clients:
      - MUSIC
      - WEBEMBEDDED
      - ANDROID_VR
      - TVHTML5_SIMPLY

    # LAPIS 1 (opsional) - PO token statis untuk client WEB/WEBEMBEDDED.
    # Token statis kedaluwarsa berkala; jalur utama PO token kita adalah
    # provider bgutil untuk yt-dlp (lihat lapis 3 + docker-compose).
    # pot:
    #   token: "${YOUTUBE_PO_TOKEN:}"
    #   visitorData: "${YOUTUBE_VISITOR_DATA:}"

    # Remote cipher untuk dekripsi signature (opsional, jalur resmi:
    # server yt-cipher self-hosted; JANGAN pakai cipher publik pihak ketiga).
    # remoteCipher:
    #   url: "${YOUTUBE_REMOTE_CIPHER_URL:}"
    #   password: "${YOUTUBE_REMOTE_CIPHER_PASSWORD:}"
    #   userAgent: "naura-hoshino-v2"

    # OAuth hanya untuk video age-restricted; gunakan akun burner.
    # oauth:
    #   enabled: false
    #   refreshToken: "${YOUTUBE_OAUTH_REFRESH:}"

  lavasrc:
    providers:
      # Mirroring: metadata Spotify (atau source lain) dicari ke sumber playable.
      # PRIORITAS: YouTube/YouTube Music > SoundCloud (kualitas lebih tinggi).
      # 1) Cari berdasarkan ISRC di YouTube Music (paling akurat + metadata musik)
      # 2) Fallback ISRC di YouTube biasa
      # 3) Fallback pencarian judul di YouTube Music (metadata musik terbaik)
      # 4) Fallback pencarian judul di YouTube (hasil lebih luas)
      # 5) Fallback terakhir SoundCloud (kualitas inferior, hanya darurat)
      - "ytmsearch:\"%ISRC%\""
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      # LavaSearch YouTube dimatikan; pencarian ditangani youtube-source +
      # source ytdlp di bawah (prefix "ytsearch:" hanya boleh satu pemilik).
      youtube: false
      vkmusic: false
      # LAPIS 3 - yt-dlp sebagai sumber YouTube utama (bypass anti-bot).
      # Source ini memproses prefix "ytsearch:" + URL youtube.com/youtu.be.
      ytdlp: true
    ytdlp:
      # Path binary yt-dlp di dalam container Lavalink (lihat Dockerfile).
      path: "${YT_DLP_PATH:yt-dlp}"
      searchLimit: 10
      mixPlaylistLoadLimit: 25
      playlistLoadLimit: 1000
      # LAPIS 1 wiring - arahkan plugin bgutil yt-dlp ke pot-server.
      # ${POT_PROVIDER_BASE_URL} di-set docker-compose (http://pot-server:4416).
      # Bila env kosong, Spring gagal resolve; pastikan selalu terisi di compose.
      customLoadArgs: ["-q", "--no-warnings", "--flat-playlist", "--skip-download", "-J", "--extractor-args", "youtubepot-bgutilhttp:base_url=${POT_PROVIDER_BASE_URL:http://pot-server:4416}"]
      customPlaybackArgs: ["-q", "--no-warnings", "-f", "bestaudio", "-J", "--extractor-args", "youtubepot-bgutilhttp:base_url=${POT_PROVIDER_BASE_URL:http://pot-server:4416}"]
    lyrics-sources:
      spotify: true
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      # Pasar regional untuk top tracks & filter katalog (ISO 3166-1 alpha-2)
      countryCode: "${SPOTIFY_MARKET:ID}"
      playlistLoadLimit: 6 # x100 track per halaman
      albumLoadLimit: 6 # x50 track per halaman
      resolveArtistsInSearch: true
      localFiles: false

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO