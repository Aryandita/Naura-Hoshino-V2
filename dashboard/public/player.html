<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pemutar Musik Naura | Kontrol Web</title>
    <meta name="description" content="Kontrol pemutar musik Discord langsung dari browser: atur durasi lagu, volume, dan pemutus otomatis." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;900&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/stellar.css" />
    <script src="/socket.io/socket.io.js"></script>
    <style>
      :root {
        --bg-void: #07090e;
        --bg-deep: #0e111a;
        --bg-card: rgba(18, 22, 36, 0.82);
        --border-glass: rgba(244, 114, 182, 0.18);
        --neon-pink: #f472b6;
        --neon-cyan: #22d3ee;
        --neon-violet: #a855f7;
        --neon-glow: rgba(244, 114, 182, 0.35);
        --text-pure: #ffffff;
        --text-sub: #94a3b8;
        --text-dim: #64748b;
        --accent-gradient: linear-gradient(135deg, #f472b6 0%, #a855f7 50%, #22d3ee 100%);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-void);
        color: var(--text-pure);
        min-height: 100vh;
        overflow-x: hidden;
        background-image:
          radial-gradient(circle at 15% 20%, rgba(244, 114, 182, 0.12) 0%, transparent 40%),
          radial-gradient(circle at 85% 80%, rgba(34, 211, 238, 0.1) 0%, transparent 40%),
          radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
      }

      .player-app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 20px 48px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      /* ── Top Navigation Bar ── */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-glass);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-avatar {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 2px solid var(--neon-pink);
        box-shadow: 0 0 12px var(--neon-glow);
        object-fit: cover;
      }

      .brand-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1px;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .brand-badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(34, 211, 238, 0.15);
        color: var(--neon-cyan);
        border: 1px solid rgba(34, 211, 238, 0.3);
      }

      .top-controls {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .guild-select {
        background: var(--bg-deep);
        color: var(--text-pure);
        border: 1px solid var(--border-glass);
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 13px;
        font-family: 'Space Grotesk', sans-serif;
        outline: none;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .guild-select:focus {
        border-color: var(--neon-pink);
        box-shadow: 0 0 10px var(--neon-glow);
      }

      .connection-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-family: 'JetBrains Mono', monospace;
        padding: 6px 12px;
        border-radius: 20px;
        background: rgba(16, 185, 129, 0.12);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.25);
      }

      .connection-pill.offline {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        border-color: rgba(239, 68, 68, 0.25);
      }

      .conn-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 6px currentColor;
      }

      /* ── Main Layout Grid ── */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 24px;
      }

      @media (max-width: 960px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── Hero Player Card ── */
      .player-card {
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-glass);
        border-radius: 24px;
        padding: 36px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }

      .vinyl-zone {
        position: relative;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .vinyl-disc {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          #0b0d14 0%,
          #1f2438 25%,
          #0b0d14 50%,
          #1f2438 75%,
          #0b0d14 100%
        );
        border: 4px solid rgba(244, 114, 182, 0.3);
        box-shadow:
          0 0 40px var(--neon-glow),
          0 0 80px rgba(34, 211, 238, 0.15),
          inset 0 0 30px rgba(0, 0, 0, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: spin-vinyl 10s linear infinite paused;
      }

      .vinyl-disc.playing {
        animation-play-state: running;
      }

      @keyframes spin-vinyl {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .vinyl-center {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--bg-deep);
        border: 3px solid var(--neon-pink);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px var(--neon-glow);
      }

      .vinyl-center img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ── Equalizer Bars ── */
      .eq-container {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 36px;
        margin-bottom: 20px;
      }

      .eq-bar {
        width: 4px;
        border-radius: 4px;
        background: var(--accent-gradient);
        box-shadow: 0 0 8px rgba(244, 114, 182, 0.4);
        min-height: 4px;
        transition: height 0.15s ease;
      }

      .eq-playing .eq-bar:nth-child(1) { animation: eq-wave 0.8s ease-in-out infinite alternate; }
      .eq-playing .eq-bar:nth-child(2) { animation: eq-wave 0.6s ease-in-out infinite alternate 0.1s; }
      .eq-playing .eq-bar:nth-child(3) { animation: eq-wave 0.9s ease-in-out infinite alternate 0.2s; }
      .eq-playing .eq-bar:nth-child(4) { animation: eq-wave 0.7s ease-in-out infinite alternate 0.3s; }
      .eq-playing .eq-bar:nth-child(5) { animation: eq-wave 1.1s ease-in-out infinite alternate 0.15s; }
      .eq-playing .eq-bar:nth-child(6) { animation: eq-wave 0.8s ease-in-out infinite alternate 0.25s; }
      .eq-playing .eq-bar:nth-child(7) { animation: eq-wave 0.95s ease-in-out infinite alternate 0.05s; }
      .eq-playing .eq-bar:nth-child(8) { animation: eq-wave 0.65s ease-in-out infinite alternate 0.35s; }
      .eq-playing .eq-bar:nth-child(9) { animation: eq-wave 0.85s ease-in-out infinite alternate 0.18s; }
      .eq-playing .eq-bar:nth-child(10) { animation: eq-wave 0.75s ease-in-out infinite alternate 0.28s; }
      .eq-playing .eq-bar:nth-child(11) { animation: eq-wave 1.0s ease-in-out infinite alternate 0.12s; }
      .eq-playing .eq-bar:nth-child(12) { animation: eq-wave 0.7s ease-in-out infinite alternate 0.22s; }

      @keyframes eq-wave {
        0% { height: 6px; }
        100% { height: 34px; }
      }

      /* ── Track Meta ── */
      .track-meta {
        text-align: center;
        margin-bottom: 24px;
        width: 100%;
        max-width: 540px;
      }

      .track-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .track-artist {
        font-size: 14px;
        color: var(--text-sub);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      /* ── Seeker Slider Component ── */
      .seeker-container {
        width: 100%;
        max-width: 580px;
        margin-bottom: 24px;
      }

      .seeker-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        outline: none;
        cursor: pointer;
        position: relative;
        transition: all 0.2s;
      }

      .seeker-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--neon-pink);
        box-shadow: 0 0 10px var(--neon-pink);
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      .seeker-slider::-webkit-slider-thumb:hover {
        transform: scale(1.3);
      }

      .seeker-time-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 12px;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-sub);
      }

      /* ── Playback Action Buttons ── */
      .player-controls {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
      }

      .ctrl-btn {
        background: var(--bg-deep);
        color: var(--text-pure);
        border: 1px solid var(--border-glass);
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .ctrl-btn:hover {
        border-color: var(--neon-cyan);
        color: var(--neon-cyan);
        transform: translateY(-2px);
        box-shadow: 0 0 14px rgba(34, 211, 238, 0.35);
      }

      .ctrl-btn.play-btn {
        width: 60px;
        height: 60px;
        font-size: 22px;
        background: var(--accent-gradient);
        border: none;
        box-shadow: 0 0 24px var(--neon-glow);
      }

      .ctrl-btn.play-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 0 32px var(--neon-glow);
        color: #fff;
      }

      /* ── Volume Slider ── */
      .volume-group {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 320px;
      }

      .vol-icon {
        color: var(--text-sub);
        font-size: 15px;
        width: 20px;
        text-align: center;
      }

      .vol-slider {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
        outline: none;
        cursor: pointer;
      }

      .vol-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--neon-cyan);
        box-shadow: 0 0 8px var(--neon-cyan);
        cursor: pointer;
      }

      .vol-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        color: var(--text-sub);
        min-width: 38px;
        text-align: right;
      }

      /* ── Side Panel (Sleep Timer & Queue) ── */
      .side-panel {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .panel-card {
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-glass);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 12px;
      }

      .panel-title {
        font-size: 15px;
        font-weight: 700;
        font-family: 'Space Grotesk', sans-serif;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ── Sleep Timer Widget ── */
      .sleep-status-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: rgba(168, 85, 247, 0.12);
        border: 1px solid rgba(168, 85, 247, 0.3);
        border-radius: 12px;
        font-size: 13px;
        margin-bottom: 16px;
        color: #d8b4fe;
      }

      .sleep-status-badge.active {
        background: rgba(244, 114, 182, 0.15);
        border-color: rgba(244, 114, 182, 0.4);
        color: var(--neon-pink);
      }

      .sleep-status-badge.fading {
        animation: pulse-fade 1s infinite alternate;
        color: #facc15;
        border-color: rgba(250, 204, 21, 0.4);
      }

      @keyframes pulse-fade {
        from { opacity: 0.6; }
        to { opacity: 1; }
      }

      .sleep-presets {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .preset-btn {
        background: var(--bg-deep);
        color: var(--text-pure);
        border: 1px solid var(--border-glass);
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        font-family: 'Space Grotesk', sans-serif;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.2s ease;
      }

      .preset-btn:hover {
        border-color: var(--neon-violet);
        background: rgba(168, 85, 247, 0.15);
        color: #fff;
        transform: translateY(-2px);
      }

      .preset-btn.cancel-btn {
        grid-column: span 2;
        border-color: rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }

      .preset-btn.cancel-btn:hover {
        background: rgba(239, 68, 68, 0.15);
        border-color: #ef4444;
      }

      /* ── Queue List ── */
      .queue-items {
        max-height: 280px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 4px;
      }

      .queue-items::-webkit-scrollbar {
        width: 4px;
      }

      .queue-items::-webkit-scrollbar-thumb {
        background: var(--border-glass);
        border-radius: 4px;
      }

      .queue-entry {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: var(--bg-deep);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        font-size: 13px;
      }

      .queue-idx {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: var(--text-dim);
        min-width: 18px;
      }

      .queue-info {
        flex: 1;
        min-width: 0;
      }

      .queue-name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .queue-dur {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: var(--text-sub);
      }

      .empty-queue {
        text-align: center;
        padding: 24px;
        color: var(--text-dim);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="player-app">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="brand">
          <img src="/assets/core/avatar.png" alt="Naura Avatar" class="brand-avatar" onerror="this.src='/naura_3d_closeup.png'" />
          <div>
            <div class="brand-title">PEMUTAR MUSIK NAURA</div>
            <div style="display:flex; align-items:center; gap:6px; margin-top:2px;">
              <span class="brand-badge">KONTROL DISCORD</span>
              <span style="font-size:11px; color:var(--text-sub);">Voice Channel</span>
            </div>
          </div>
        </div>

        <div class="top-controls">
          <select id="guildSelect" class="guild-select" title="Pilih Server Discord">
            <option value="sandbox">Sandbox / Demo Player</option>
          </select>
          <div id="connPill" class="connection-pill">
            <span class="conn-dot"></span>
            <span id="connLabel">Terhubung</span>
          </div>
        </div>
      </header>

      <!-- Main Grid -->
      <main class="main-grid">
        <!-- Hero Music Player Card -->
        <section class="player-card">
          <!-- Spinning Vinyl Disc -->
          <div class="vinyl-zone">
            <div id="vinylDisc" class="vinyl-disc">
              <div class="vinyl-center">
                <img id="trackArtwork" src="/assets/core/avatar.png" alt="Track Art" onerror="this.src='/naura_3d_closeup.png'" />
              </div>
            </div>
          </div>

          <!-- Dynamic Equalizer Bars -->
          <div id="eqBars" class="eq-container">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>

          <!-- Track Metadata -->
          <div class="track-meta">
            <h1 id="trackTitle" class="track-title">Menunggu Lagu</h1>
            <div class="track-artist">
              <span id="trackAuthor">Ketik /music play di Discord untuk mulai</span>
              <span>•</span>
              <span id="trackSourceBadge" style="font-family:'JetBrains Mono'; font-size:11px; color:var(--neon-cyan);">STANDBY</span>
            </div>
          </div>

          <!-- Seeker Progress Bar -->
          <div class="seeker-container">
            <input type="range" id="seekerBar" class="seeker-slider" min="0" max="1000" value="0" step="1" title="Geser untuk memindahkan durasi lagu" />
            <div class="seeker-time-labels">
              <span id="currentTimeLabel">0:00</span>
              <span id="durationLabel">0:00</span>
            </div>
          </div>

          <!-- Playback Action Buttons -->
          <div class="player-controls">
            <button id="btnPrev" class="ctrl-btn" title="Lagu Sebelumnya">
              <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="btnPlayPause" class="ctrl-btn play-btn" title="Putar / Jeda">
              <i id="playIcon" class="fa-solid fa-play"></i>
            </button>
            <button id="btnNext" class="ctrl-btn" title="Lewati Lagu (Skip)">
              <i class="fa-solid fa-forward-step"></i>
            </button>
            <button id="btnStop" class="ctrl-btn" title="Hentikan Musik">
              <i class="fa-solid fa-stop"></i>
            </button>
          </div>

          <!-- Master Volume Slider -->
          <div class="volume-group">
            <i id="volIcon" class="fa-solid fa-volume-high vol-icon"></i>
            <input type="range" id="volSlider" class="vol-slider" min="0" max="150" value="80" title="Atur volume audio" />
            <span id="volLabel" class="vol-label">80%</span>
          </div>
        </section>

        <!-- Right Side Panel -->
        <aside class="side-panel">
          <!-- Sleep Timer Widget -->
          <div class="panel-card">
            <div class="panel-header">
              <div class="panel-title">
                <i class="fa-solid fa-moon" style="color:var(--neon-violet);"></i>
                Pemutus Musik Otomatis
              </div>
            </div>

            <div id="sleepStatusBadge" class="sleep-status-badge">
              <i class="fa-regular fa-clock"></i>
              <span id="sleepStatusText">Belum Diatur</span>
            </div>

            <div class="sleep-presets">
              <button class="preset-btn" onclick="setSleep(15)">
                <i class="fa-solid fa-bed"></i> 15 Menit
              </button>
              <button class="preset-btn" onclick="setSleep(30)">
                <i class="fa-solid fa-bed"></i> 30 Menit
              </button>
              <button class="preset-btn" onclick="setSleep(45)">
                <i class="fa-solid fa-bed"></i> 45 Menit
              </button>
              <button class="preset-btn" onclick="setSleep(60)">
                <i class="fa-solid fa-bed"></i> 60 Menit
              </button>
              <button class="preset-btn cancel-btn" onclick="setSleep(0)">
                <i class="fa-solid fa-xmark"></i> Batalkan Timer
              </button>
            </div>
          </div>

          <!-- Live Queue Panel -->
          <div class="panel-card" style="flex:1;">
            <div class="panel-header">
              <div class="panel-title">
                <i class="fa-solid fa-list-ol" style="color:var(--neon-cyan);"></i>
                Antrean Musik
              </div>
              <span id="queueCount" style="font-size:12px; font-family:'JetBrains Mono'; color:var(--text-sub);">0 Lagu</span>
            </div>

            <div id="queueList" class="queue-items">
              <div class="empty-queue">
                <i class="fa-solid fa-music" style="font-size:24px; margin-bottom:8px; opacity:0.4; display:block;"></i>
                Antrean musik kosong. Putar lagu dengan <code>/music play</code>.
              </div>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <!-- Client Script -->
    <script>
      let socket = null;
      let activeGuildId = 'sandbox';
      let isPlaying = false;
      let currentTrackDuration = 0;
      let currentTrackPosition = 0;
      let isSeeking = false;
      let lastStateTimestamp = Date.now();

      function formatTime(ms) {
        const totalSec = Math.floor(Math.max(0, Number(ms) || 0) / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function updateUI(state) {
        if (!state) return;

        isPlaying = !!state.isPlaying && !state.isPaused;
        const playIcon = document.getElementById('playIcon');
        if (playIcon) {
          playIcon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        }

        const disc = document.getElementById('vinylDisc');
        if (disc) disc.classList.toggle('playing', isPlaying);

        const eq = document.getElementById('eqBars');
        if (eq) eq.classList.toggle('eq-playing', isPlaying);

        // Metadata
        if (state.currentTrack) {
          document.getElementById('trackTitle').textContent = state.currentTrack.title || 'Unknown Track';
          document.getElementById('trackAuthor').textContent = state.currentTrack.author || 'Naura Radio';
          currentTrackDuration = state.currentTrack.duration || 0;
          currentTrackPosition = state.currentTrack.position || 0;
        } else {
          document.getElementById('trackTitle').textContent = 'Tidak Ada Musik Aktif';
          document.getElementById('trackAuthor').textContent = 'Gunakan /music play di Discord';
          currentTrackDuration = 0;
          currentTrackPosition = 0;
        }

        document.getElementById('durationLabel').textContent = formatTime(currentTrackDuration);

        if (!isSeeking) {
          document.getElementById('currentTimeLabel').textContent = formatTime(currentTrackPosition);
          const seeker = document.getElementById('seekerBar');
          if (seeker && currentTrackDuration > 0) {
            seeker.value = Math.round((currentTrackPosition / currentTrackDuration) * 1000);
          } else if (seeker) {
            seeker.value = 0;
          }
        }

        // Volume
        if (state.volume !== undefined) {
          const vol = Number(state.volume);
          const volSlider = document.getElementById('volSlider');
          const volLabel = document.getElementById('volLabel');
          if (volSlider && document.activeElement !== volSlider) volSlider.value = vol;
          if (volLabel) volLabel.textContent = vol + '%';
        }

        // Sleep Timer
        updateSleepBadge(state.sleepTimer);

        // Queue
        renderQueue(state.queue || []);
      }

      function updateSleepBadge(timer) {
        const badge = document.getElementById('sleepStatusBadge');
        const text = document.getElementById('sleepStatusText');
        if (!badge || !text) return;

        if (timer && timer.remainingMs > 0) {
          const remainingSec = Math.ceil(timer.remainingMs / 1000);
          const mins = Math.floor(remainingSec / 60);
          const secs = remainingSec % 60;
          const timeStr = mins + 'm ' + (secs < 10 ? '0' : '') + secs + 's';

          if (timer.isFading || remainingSec <= 15) {
            badge.className = 'sleep-status-badge fading';
            text.textContent = 'Memudar... Selesai dalam ' + timeStr;
          } else {
            badge.className = 'sleep-status-badge active';
            text.textContent = 'Berhenti dalam ' + timeStr + ' (fade-out 15s)';
          }
        } else {
          badge.className = 'sleep-status-badge';
          text.textContent = 'Belum Diatur';
        }
      }

      function renderQueue(queue) {
        const list = document.getElementById('queueList');
        const count = document.getElementById('queueCount');
        if (count) count.textContent = queue.length + ' Lagu';
        if (!list) return;

        if (!queue || queue.length === 0) {
          list.innerHTML = '<div class="empty-queue"><i class="fa-solid fa-music" style="font-size:24px; margin-bottom:8px; opacity:0.4; display:block;"></i>Antrean musik kosong. Putar lagu dengan <code>/music play</code>.</div>';
          return;
        }

        list.innerHTML = queue.map((track, i) => `
          <div class="queue-entry">
            <span class="queue-idx">${i + 1}</span>
            <div class="queue-info">
              <div class="queue-name">${escapeHtml(track.title || 'Untitled')}</div>
              <div class="queue-dur">${track.requester ? track.requester + ' • ' : ''}${formatTime(track.duration)}</div>
            </div>
          </div>
        `).join('');
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function sendMusicControl(action, value) {
        const payload = { guildId: activeGuildId, action, value };
        if (socket && socket.connected) {
          socket.emit('music_control', payload);
        } else {
          // Fallback ke REST API
          fetch('/api/music/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          }).catch(() => {});
        }
      }

      function setSleep(minutes) {
        sendMusicControl('sleep', minutes);
      }

      // Seeker events
      const seekerBar = document.getElementById('seekerBar');
      if (seekerBar) {
        seekerBar.addEventListener('input', function() {
          isSeeking = true;
          const ratio = this.value / 1000;
          const targetMs = Math.round(ratio * currentTrackDuration);
          document.getElementById('currentTimeLabel').textContent = formatTime(targetMs);
        });

        seekerBar.addEventListener('change', function() {
          isSeeking = false;
          const ratio = this.value / 1000;
          const targetMs = Math.round(ratio * currentTrackDuration);
          sendMusicControl('seek', targetMs);
        });
      }

      // Volume slider events
      const volSlider = document.getElementById('volSlider');
      if (volSlider) {
        volSlider.addEventListener('input', function() {
          document.getElementById('volLabel').textContent = this.value + '%';
        });

        volSlider.addEventListener('change', function() {
          sendMusicControl('volume', parseInt(this.value, 10));
        });
      }

      // Button controls
      document.getElementById('btnPlayPause')?.addEventListener('click', () => {
        sendMusicControl(isPlaying ? 'pause' : 'resume');
      });

      document.getElementById('btnNext')?.addEventListener('click', () => {
        sendMusicControl('skip');
      });

      document.getElementById('btnPrev')?.addEventListener('click', () => {
        sendMusicControl('previous');
      });

      document.getElementById('btnStop')?.addEventListener('click', () => {
        sendMusicControl('stop');
      });

      // Socket.IO Setup
      if (typeof io !== 'undefined') {
        socket = io();

        socket.on('connect', () => {
          const pill = document.getElementById('connPill');
          const label = document.getElementById('connLabel');
          if (pill) pill.className = 'connection-pill';
          if (label) label.textContent = 'Live Connected';

          socket.emit('join_room', 'dashboard:home');
          if (activeGuildId) socket.emit('join_guild_music', activeGuildId);
        });

        socket.on('disconnect', () => {
          const pill = document.getElementById('connPill');
          const label = document.getElementById('connLabel');
          if (pill) pill.className = 'connection-pill offline';
          if (label) label.textContent = 'Offline';
        });

        socket.on('music_state', (data) => {
          updateUI(data);
        });
      }

      // Load Guilds for selector
      async function loadGuilds() {
        try {
          const res = await fetch('/api/guilds');
          if (!res.ok) return;
          const data = await res.json();
          const guilds = data.guilds || data;
          if (Array.isArray(guilds) && guilds.length > 0) {
            const select = document.getElementById('guildSelect');
            select.innerHTML = guilds.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');
            activeGuildId = guilds[0].id;
            if (socket && socket.connected) {
              socket.emit('join_guild_music', activeGuildId);
            }
          }
        } catch (_) {}
      }

      document.getElementById('guildSelect')?.addEventListener('change', function() {
        activeGuildId = this.value;
        if (socket && socket.connected) {
          socket.emit('join_guild_music', activeGuildId);
        }
      });

      // Local ticker for progress bar when playing
      setInterval(() => {
        if (isPlaying && !isSeeking && currentTrackDuration > 0) {
          currentTrackPosition = Math.min(currentTrackPosition + 1000, currentTrackDuration);
          document.getElementById('currentTimeLabel').textContent = formatTime(currentTrackPosition);
          const seeker = document.getElementById('seekerBar');
          if (seeker) {
            seeker.value = Math.round((currentTrackPosition / currentTrackDuration) * 1000);
          }
        }
      }, 1000);

      window.addEventListener('load', () => {
        loadGuilds();
      });
    </script>
  </body>
</html>
