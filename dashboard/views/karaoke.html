<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naura Synced Karaoke & Audio Spectrum</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/tokens.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .karaoke-line {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.35;
            transform: scale(0.92);
        }
        .karaoke-line.active {
            opacity: 1;
            transform: scale(1.1);
            color: #FFB6C1;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.8), 0 0 40px rgba(255, 182, 193, 0.4);
            font-weight: 700;
        }
    </style>
</head>
<body class="relative h-screen flex flex-col items-center justify-between p-8 select-none">
    <!-- Spectrum Particle Canvas -->
    <canvas id="spectrumCanvas" class="absolute inset-0 w-full h-full -z-10"></canvas>

    <!-- Top Header -->
    <header class="w-full max-w-5xl flex justify-between items-center z-10">
        <div class="glass-panel-interactive px-6 py-3 rounded-2xl flex items-center gap-3">
            <div class="audio-equalizer">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>
            <div>
                <h1 class="text-lg font-bold font-cyber text-glow text-white">NAURA KARAOKE STUDIO</h1>
                <p class="text-[11px] text-gray-400">Live Synced Visualizer • Ultra-Fidelity</p>
            </div>
        </div>

        <a href="/music" class="glass-panel-interactive px-4 py-2 rounded-xl text-xs font-bold text-pink-300 hover:text-white transition-all">
            ← Control Panel Musik
        </a>
    </header>

    <!-- Center Synced Lyrics Stage -->
    <main class="w-full max-w-3xl text-center space-y-6 z-10 my-auto">
        <div id="trackInfo" class="space-y-1">
            <h2 id="songTitle" class="text-2xl md:text-3xl font-bold font-cyber text-white">Menunggu Transmisi Audio...</h2>
            <p id="songArtist" class="text-sm text-pink-300 font-cyber">Pilih lagu di Discord atau Control Panel</p>
        </div>

        <div id="lyricsContainer" class="py-8 space-y-4 max-h-[300px] overflow-hidden flex flex-col items-center justify-center">
            <p class="karaoke-line text-lg text-gray-400">♫ Menghubungkan ke Voice Channel ♫</p>
            <p class="karaoke-line active text-2xl md:text-3xl">Naura siap bernyanyi bersamamu!</p>
            <p class="karaoke-line text-lg text-gray-400">Putar lagu apa saja untuk memulai lirik otomatis.</p>
        </div>
    </main>

    <!-- Bottom Audio Progress Bar -->
    <footer class="w-full max-w-2xl glass-panel-interactive p-4 rounded-2xl z-10 flex flex-col gap-2">
        <div class="flex justify-between text-xs font-cyber text-gray-400">
            <span id="currentTime">0:00</span>
            <span id="totalDuration">0:00</span>
        </div>
        <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-gradient-to-r from-pink-400 to-purple-400 w-0 transition-all duration-300"></div>
        </div>
    </footer>

    <script>
        // Spectrum Visualizer
        const canvas = document.getElementById("spectrumCanvas");
        const ctx = canvas.getContext("2d");
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        let phase = 0;
        function drawSpectrum() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            phase += 0.03;

            const bars = 64;
            const barWidth = canvas.width / bars;

            for (let i = 0; i < bars; i++) {
                const height = Math.sin(phase + i * 0.15) * 60 + Math.cos(phase * 0.8 + i * 0.2) * 40 + 80;
                const x = i * barWidth;
                const y = canvas.height - height;

                const grad = ctx.createLinearGradient(0, y, 0, canvas.height);
                grad.addColorStop(0, "rgba(255, 182, 193, 0.4)");
                grad.addColorStop(1, "rgba(192, 132, 252, 0.05)");

                ctx.fillStyle = grad;
                ctx.fillRect(x, y, barWidth - 3, height);
            }
            requestAnimationFrame(drawSpectrum);
        }
        drawSpectrum();

        // Socket.IO Integration
        const socket = io();
        socket.on("connect", () => {
            console.log("Karaoke Studio terhubung ke WebSocket!");
        });

        socket.on("music_state", (state) => {
            if (state && state.currentTrack) {
                document.getElementById("songTitle").textContent = state.currentTrack.title;
                const dur = Math.floor(state.currentTrack.duration / 1000);
                const pos = Math.floor((state.currentTrack.position || 0) / 1000);
                
                const fmt = (s) => `${Math.floor(s/60)}:${(s%60).toString().padStart(2, '0')}`;
                document.getElementById("currentTime").textContent = fmt(pos);
                document.getElementById("totalDuration").textContent = fmt(dur);

                const percent = Math.min(100, (pos / (dur || 1)) * 100);
                document.getElementById("progressBar").style.width = `${percent}%`;
            }
        });
    </script>
</body>
</html>
