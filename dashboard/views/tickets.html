<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat Tiket - Naura Hoshino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css?v=3" />
  </head>
  <body
    class="bg-animated min-h-screen text-white font-['Outfit'] p-6 lg:p-12 overflow-y-auto"
  >
    <!-- Kontainer Utama -->
    <div class="max-w-4xl mx-auto">
      <!-- Header -->
      <div class="flex items-center gap-4 mb-8">
        <a
          href="/"
          class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-[var(--color-muted)] hover:text-white hover:border-[var(--color-primary-glow)] transition-all duration-300"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
          <h1
            class="text-2xl font-cyber font-bold text-[var(--color-primary)] text-glow"
          >
            Riwayat Tiket
          </h1>
          <p class="text-sm text-[var(--color-muted)]">
            Lihat kembali percakapan tiket dukungan yang pernah kamu buka.
          </p>
        </div>
      </div>

      <!-- Daftar Tiket -->
      <div
        class="glass-panel p-6 rounded-3xl bg-black/40 border border-white/5 shadow-lg min-h-[400px]"
      >
        <div id="ticketList" class="flex flex-col gap-4">
          <div class="text-center text-[var(--color-muted)] py-12">
            <i
              class="fa-solid fa-circle-notch fa-spin text-3xl mb-4 text-[var(--color-primary)]"
            ></i>
            <p>Memuat riwayat tiketmu...</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      async function fetchTickets() {
        try {
          const res = await fetch("/api/tickets/me");
          if (!res.ok) throw new Error("Gagal mengambil data");
          const data = await res.json();

          const list = document.getElementById("ticketList");
          list.innerHTML = "";

          if (!data.tickets || data.tickets.length === 0) {
            list.innerHTML = `
                        <div class="text-center text-[var(--color-muted)] py-12">
                            <i class="fa-solid fa-ticket-simple text-4xl mb-4 opacity-50"></i>
                            <p>Kamu belum pernah membuat tiket dukungan apa pun.</p>
                        </div>
                    `;
            return;
          }

          data.tickets.forEach((ticket) => {
            const dateObj = new Date(ticket.createdAt);
            const dateStr = dateObj.toLocaleDateString("id-ID", {
              year: "numeric",
              month: "short",
              day: "numeric",
            });
            const timeStr = dateObj.toLocaleTimeString("id-ID", {
              hour: "2-digit",
              minute: "2-digit",
            });

            let actionButton = "";
            let statusBadge = "";

            if (ticket.status === "closed") {
              statusBadge = `<span class="px-3 py-1 text-xs font-bold rounded-full bg-zinc-800 text-zinc-300 border border-zinc-700">CLOSED</span>`;
              if (ticket.transcriptPath) {
                actionButton = `<a href="${ticket.transcriptPath}" target="_blank" class="px-4 py-2 rounded-xl bg-purple-600/20 text-purple-300 border border-purple-500/30 hover:bg-purple-600/40 transition-colors text-sm font-semibold flex items-center gap-2"><i class="fa-solid fa-file-lines"></i> Transkrip</a>`;
              } else {
                actionButton = `<button disabled class="px-4 py-2 rounded-xl bg-zinc-800 text-zinc-500 border border-zinc-700 text-sm font-semibold cursor-not-allowed flex items-center gap-2"><i class="fa-solid fa-file-excel"></i> Hilang</button>`;
              }
            } else if (ticket.status === "open") {
              statusBadge = `<span class="px-3 py-1 text-xs font-bold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">OPEN</span>`;
              actionButton = `<button disabled class="px-4 py-2 rounded-xl bg-[var(--color-primary-dark)] text-white/50 border border-[var(--color-primary-dark)] text-sm font-semibold cursor-not-allowed flex items-center gap-2"><i class="fa-solid fa-spinner fa-spin"></i> Berjalan</button>`;
            }

            list.innerHTML += `
                        <div class="glass-panel p-5 rounded-2xl bg-black/40 border border-white/5 hover:-translate-y-1 transition-transform duration-300 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <h3 class="font-cyber font-bold text-lg text-white">#${ticket.id}</h3>
                                    ${statusBadge}
                                </div>
                                <p class="text-sm text-[var(--color-muted)] flex items-center gap-2">
                                    <i class="fa-regular fa-calendar text-[var(--color-primary)]"></i> ${dateStr} &nbsp; 
                                    <i class="fa-regular fa-clock text-[var(--color-primary)]"></i> ${timeStr}
                                </p>
                            </div>
                            <div class="flex-shrink-0">
                                ${actionButton}
                            </div>
                        </div>
                    `;
          });
        } catch (err) {
          document.getElementById("ticketList").innerHTML = `
                    <div class="text-center text-red-400 py-12">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-4"></i>
                        <p>Ups, gagal memuat riwayat tiket.</p>
                    </div>
                `;
        }
      }

      fetchTickets();
    </script>
  </body>
</html>
