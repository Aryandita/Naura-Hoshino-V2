<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economy | Naura OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/tokens.css">
    <script src="/js/naura-ui.js"></script>

</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center bg-animated theme-none" id="mainBody">
    <div class="w-full max-w-5xl animate-fade-in">
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 pb-4 border-b border-[var(--color-hairline)] gap-4">
            <div>
                <h1 class="text-3xl font-black font-cyber text-glow tracking-wider text-white flex items-center gap-3">
                    <i class="fa-solid fa-chart-line text-green-400 animate-pulse"></i> ECONOMY DASHBOARD
                </h1>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest font-cyber mt-1">Statistik Ekonomi Server</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="langToggle" title="Bahasa / Language" class="btn-discord px-4 py-2.5 text-xs font-cyber tracking-widest uppercase bg-transparent border border-[var(--color-hairline)] text-gray-300 hover:text-white hover:border-[var(--color-primary-glow)] hover:bg-[var(--color-surface-glass)]">
                    <i class="fa-solid fa-language mr-2"></i><span id="langLabel">ID</span>
                </button>
                <a href="/" class="btn-discord px-5 py-2.5 text-xs font-cyber tracking-widest uppercase bg-transparent border border-[var(--color-hairline)] text-gray-300 hover:text-white hover:border-[var(--color-primary-glow)] hover:bg-[var(--color-surface-glass)]">
                    <i class="fa-solid fa-arrow-left mr-2"></i><span>Beranda</span>
                </a>
            </div>
        </div>

        <!-- Global Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8" id="economy-stats-container">
            <div class="telemetry-card flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-star text-3xl text-yellow-400 mb-2"></i>
                <div class="text-gray-400 text-xs font-cyber tracking-wider uppercase mb-1">Star Fragments</div>
                <div class="text-2xl font-black font-cyber text-glow text-white" id="stat-circulation">Memuat...</div>
            </div>
            <div class="telemetry-card flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-ticket text-3xl text-orange-400 mb-2"></i>
                <div class="text-gray-400 text-xs font-cyber tracking-wider uppercase mb-1">Total Coupons</div>
                <div class="text-xl font-bold font-cyber text-glow text-gray-200" id="stat-coupons">Memuat...</div>
            </div>
            <div class="telemetry-card flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-users text-3xl text-cyan-400 mb-2"></i>
                <div class="text-gray-400 text-xs font-cyber tracking-wider uppercase mb-1">Total Akun</div>
                <div class="text-xl font-bold font-cyber text-glow text-gray-200" id="stat-users">Memuat...</div>
            </div>
        </div>

        <h2 class="text-xl font-bold font-cyber text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-crown text-yellow-400"></i> Top 20 Terkaya</h2>

        <!-- Tabel Leaderboard -->
        <div class="glass-panel rounded-3xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-black/60 border-b border-[var(--color-hairline-strong)] text-xs tracking-wider text-[var(--color-muted)] font-cyber">
                        <tr>
                            <th class="px-3 md:px-6 py-5 text-center w-16 md:w-20">Peringkat</th>
                            <th class="px-3 md:px-6 py-5">Pemain</th>
                            <th class="px-3 md:px-6 py-5 text-right">Kekayaan Bersih</th>
                            <th class="px-3 md:px-6 py-5 text-center w-28 md:w-36">Status</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="text-sm bg-black/20"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var body = document.getElementById('mainBody');
            var tbody = document.getElementById('leaderboard-body');

            var savedBg = localStorage.getItem('bgTheme') || 'none';
            function paintBackground() {
                body.style.backgroundImage = "url('" + NauraUI.resolveBgUrl(savedBg) + "')";
            }
            if (savedBg !== 'none' && savedBg !== 'white') {
                paintBackground();
                if (savedBg.indexOf('adaptive-') === 0) {
                    window.addEventListener('resize', paintBackground);
                }
            } else if (savedBg === 'white') {
                body.style.backgroundColor = '#f3f4f6';
                body.classList.remove('theme-none');
                body.classList.add('theme-white');
            }

            document.addEventListener('click', function (event) {
                if (event.target && typeof event.target.closest === 'function' && event.target.closest('button, a, tbody tr')) NauraUI.playClickSfx();
            });

            var langToggle = document.getElementById('langToggle');
            var langLabel = document.getElementById('langLabel');
            function syncLangLabel() { langLabel.textContent = NauraUI.lang.toUpperCase(); }
            langToggle.addEventListener('click', async function () {
                await NauraUI.setLanguage(NauraUI.lang === 'id' ? 'en' : 'id');
                syncLangLabel();
            });
            syncLangLabel();

            function fullRowState(kind, options) {
                tbody.innerHTML = '<tr><td colspan="4">' + NauraUI.stateHtml(kind, options) + '</td></tr>';
            }

            function num(value) {
                return Number(value || 0).toLocaleString(NauraUI.lang === 'en' ? 'en-US' : 'id-ID');
            }

            function medal(index) {
                var colors = ['text-yellow-400', 'text-gray-300', 'text-orange-500'];
                if (index > 2) return '<span class="text-gray-500 font-bold font-cyber text-base">#' + (index + 1) + '</span>';
                return '<i class="fa-solid fa-medal ' + colors[index] + ' text-3xl"></i>';
            }

            function badge(user) {
                if (user.isOwner) return '<span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-xs px-3 py-1 rounded-full font-bold font-cyber"><i class="fa-solid fa-crown mr-1"></i>OWNER</span>';
                if (user.isPremium) return '<span class="bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 text-xs px-3 py-1 rounded-full font-bold font-cyber"><i class="fa-solid fa-star mr-1"></i>VIP</span>';
                return '<span class="text-gray-500 bg-black/40 border border-white/5 px-3 py-1 rounded-full text-xs font-semibold">Member</span>';
            }

            async function loadStats() {
                try {
                    var res = await fetch('/api/economy_stats');
                    if (res.ok) {
                        var data = await res.json();
                        document.getElementById('stat-circulation').textContent = num(data.total_star_fragments);
                        document.getElementById('stat-coupons').textContent = num(data.total_coupons);
                        document.getElementById('stat-users').textContent = num(data.total_users);
                    }
                } catch (e) {
                    console.error('Failed to load stats', e);
                }
            }

            async function renderLeaderboard() {
                fullRowState('loading');
                try {
                    var res = await fetch('/api/leaderboard?type=wealth&limit=20');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    var users = await res.json();
                    
                    if (!Array.isArray(users) || users.length === 0) {
                        fullRowState('empty');
                        return;
                    }

                    var fallbackAvatar = NauraUI.expressionUrl('shy');
                    tbody.innerHTML = users.map(function (u, index) {
                        var rowStyle = index < 3
                            ? ['bg-yellow-500/5 border-l-4 border-yellow-400', 'bg-gray-400/5 border-l-4 border-gray-300', 'bg-orange-500/5 border-l-4 border-orange-500'][index]
                            : 'border-b border-[var(--color-hairline)] hover:bg-[var(--color-surface-glass-hover)] border-l-4 border-transparent';

                        var wealthHtml = '<div class="text-yellow-400 font-bold font-cyber text-lg">⭐ ' + num(u.starFragments) + '</div>';

                        return '<tr class="' + rowStyle + ' transition duration-300">' +
                            '<td class="px-3 md:px-6 py-4 text-center">' + medal(index) + '</td>' +
                            '<td class="px-3 md:px-6 py-4 font-assist text-white">' +
                            '<div class="flex items-center gap-3">' +
                            '<img src="' + (u.avatar || fallbackAvatar) + '" loading="lazy" class="w-10 h-10 rounded-full border border-pink-400/40 object-cover" onerror="this.onerror=null;this.src=\'' + fallbackAvatar + '\'">' +
                            '<div class="flex flex-col min-w-0">' +
                            '<span class="font-bold text-sm leading-tight text-white truncate">' + u.name + '</span>' +
                            '<span class="text-[9px] text-gray-400 font-cyber tracking-wider">' + u.userId + '</span>' +
                            '</div></div></td>' +
                            '<td class="px-3 md:px-6 py-4 text-right font-cyber">' + wealthHtml + '</td>' +
                            '<td class="px-3 md:px-6 py-4 text-center">' + badge(u) + '</td>' +
                            '</tr>';
                    }).join('');
                } catch (err) {
                    console.error('[Economy Leaderboard]', err);
                    fullRowState('error');
                }
            }

            loadStats();
            renderLeaderboard();
        })();
    </script>
</body>
</html>
