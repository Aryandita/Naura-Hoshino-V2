<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naura Portfolio, Member Showcase</title>
    <meta
      name="description"
      content="Lihat profil, statistik RPG, koleksi kartu, dan pencapaian member komunitas Naura Hoshino."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #ffb6c1;
        --primary-glow: rgba(255, 182, 193, 0.35);
        --accent-purple: #c084fc;
        --accent-blue: #93c5fd;
        --accent-green: #86efac;
        --accent-gold: #ffd700;
        --canvas: #08090c;
        --surface: rgba(255, 255, 255, 0.03);
        --surface-hover: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 182, 193, 0.15);
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --font-cyber: "Orbitron", sans-serif;
        --font-body: "Outfit", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--canvas);
        color: var(--text);
        font-family: var(--font-body);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ===== PARTICLES BG ===== */
      #bg-particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      /* ===== WRAPPER ===== */
      .portfolio-root {
        position: relative;
        z-index: 1;
        max-width: 900px;
        margin: 0 auto;
        padding: 0 16px 80px;
      }

      /* ===== HERO / HEADER ===== */
      .hero {
        position: relative;
        border-radius: 0 0 24px 24px;
        overflow: hidden;
        margin-bottom: 28px;
      }
      .hero-banner {
        width: 100%;
        height: 200px;
        background: linear-gradient(
          135deg,
          #12071a 0%,
          #1a0a2e 40%,
          #0d1a2e 100%
        );
        position: relative;
      }
      .hero-banner-particles {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 30% 50%,
            rgba(192, 132, 252, 0.2) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 80% 30%,
            rgba(255, 182, 193, 0.15) 0%,
            transparent 50%
          );
      }
      .hero-banner-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.6;
      }

      .hero-info {
        display: flex;
        align-items: flex-end;
        gap: 20px;
        padding: 0 28px 24px;
        background: linear-gradient(to bottom, transparent, var(--canvas));
        margin-top: -60px;
        position: relative;
      }
      .hero-avatar-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .hero-avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 3px solid var(--primary);
        box-shadow: 0 0 20px var(--primary-glow);
        background: #1a1a2e;
        object-fit: cover;
      }
      .hero-premium-ring {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: conic-gradient(
          var(--accent-gold),
          var(--primary),
          var(--accent-purple),
          var(--accent-gold)
        );
        z-index: -1;
        animation: ring-spin 4s linear infinite;
      }
      @keyframes ring-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hero-details {
        flex: 1;
        padding-bottom: 4px;
      }
      .hero-name {
        font-family: var(--font-cyber);
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
        line-height: 1.2;
      }
      .hero-tagline {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-top: 4px;
      }
      .hero-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .badge-premium {
        background: rgba(255, 215, 0, 0.15);
        color: var(--accent-gold);
        border: 1px solid rgba(255, 215, 0, 0.3);
      }
      .badge-custom {
        background: rgba(255, 182, 193, 0.12);
        color: var(--primary);
        border: 1px solid var(--border);
      }
      .badge-public {
        background: rgba(134, 239, 172, 0.1);
        color: var(--accent-green);
        border: 1px solid rgba(134, 239, 172, 0.2);
      }

      .hero-actions {
        display: flex;
        gap: 10px;
        align-self: flex-end;
        padding-bottom: 4px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border-radius: 10px;
        font-family: var(--font-body);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: var(--primary);
        color: #0d0a12;
      }
      .btn-primary:hover {
        background: #ffc8d1;
        transform: translateY(-1px);
        box-shadow: 0 4px 16px var(--primary-glow);
      }
      .btn-ghost {
        background: var(--surface);
        color: var(--text-muted);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      /* ===== BIO CARD ===== */
      .bio-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px 24px;
        margin-bottom: 20px;
        backdrop-filter: blur(16px);
        font-size: 0.92rem;
        line-height: 1.7;
        color: var(--text-muted);
      }
      .bio-card p {
        color: var(--text);
      }
      .view-count {
        margin-top: 10px;
        font-size: 0.78rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* ===== SECTION ===== */
      .section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px 22px;
        margin-bottom: 16px;
        backdrop-filter: blur(16px);
        transition: border-color 0.2s;
      }
      .section:hover {
        border-color: rgba(255, 182, 193, 0.3);
      }

      .section-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      .section-icon {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: rgba(255, 182, 193, 0.12);
        font-size: 1rem;
        flex-shrink: 0;
      }
      .section-title {
        font-family: var(--font-cyber);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--primary);
        text-transform: uppercase;
      }

      /* ===== STATS GRID ===== */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
      .stat-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 182, 193, 0.08);
        border-radius: 12px;
        padding: 14px 16px;
        text-align: center;
        transition: all 0.2s;
      }
      .stat-card:hover {
        background: var(--surface-hover);
        border-color: var(--border);
        transform: translateY(-2px);
      }
      .stat-value {
        font-family: var(--font-cyber);
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--primary);
        line-height: 1.2;
      }
      .stat-label {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .stat-card.gold .stat-value {
        color: var(--accent-gold);
      }
      .stat-card.purple .stat-value {
        color: var(--accent-purple);
      }
      .stat-card.blue .stat-value {
        color: var(--accent-blue);
      }
      .stat-card.green .stat-value {
        color: var(--accent-green);
      }

      /* ===== PET CARDS ===== */
      .pet-grid {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .pet-card {
        flex: 1;
        min-width: 160px;
        max-width: 220px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        text-align: center;
        transition: all 0.2s;
      }
      .pet-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(192, 132, 252, 0.15);
        border-color: rgba(192, 132, 252, 0.3);
      }
      .pet-emoji {
        font-size: 2.5rem;
        margin-bottom: 8px;
      }
      .pet-name {
        font-weight: 700;
        font-size: 0.95rem;
      }
      .pet-meta {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .pet-cosmic {
        color: var(--accent-gold);
        font-size: 0.72rem;
        margin-top: 4px;
      }

      /* ===== CARD COLLECTION ===== */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
      }
      .tcg-card {
        background: linear-gradient(145deg, #1a1a2e, #0f0f23);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 8px;
        text-align: center;
        transition: all 0.2s;
        cursor: default;
        position: relative;
        overflow: hidden;
      }
      .tcg-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 182, 193, 0.05) 0%,
          transparent 50%,
          rgba(192, 132, 252, 0.05) 100%
        );
      }
      .tcg-card:hover {
        transform: scale(1.04);
        border-color: var(--primary);
        box-shadow: 0 4px 20px var(--primary-glow);
      }
      .tcg-card.awakened {
        border-color: var(--accent-gold);
      }
      .tcg-card.awakened::after {
        content: "⚡";
        position: absolute;
        top: 4px;
        right: 6px;
        font-size: 0.7rem;
      }
      .tcg-rarity {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .tcg-rarity.SR {
        color: #ff8c00;
      }
      .tcg-rarity.SSR {
        color: var(--accent-gold);
      }
      .tcg-rarity.UR {
        color: var(--accent-purple);
      }
      .tcg-char {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text);
      }
      .tcg-series {
        font-size: 0.68rem;
        color: var(--text-muted);
        margin-top: 2px;
      }

      /* ===== ACHIEVEMENTS ===== */
      .achievement-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
      .ach-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 10px;
        text-align: center;
        transition: all 0.2s;
      }
      .ach-card:hover {
        border-color: var(--accent-gold);
        transform: translateY(-2px);
      }
      .ach-icon {
        font-size: 1.8rem;
        margin-bottom: 6px;
      }
      .ach-name {
        font-size: 0.75rem;
        font-weight: 600;
      }
      .ach-date {
        font-size: 0.65rem;
        color: var(--text-muted);
        margin-top: 3px;
      }

      /* ===== SOCIAL LINKS ===== */
      .social-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .social-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 600;
        text-decoration: none;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        transition: all 0.2s;
      }
      .social-btn:hover {
        background: var(--surface-hover);
        transform: translateY(-1px);
      }
      .social-btn i {
        font-size: 1rem;
      }
      .social-btn.youtube {
        --c: #ff0000;
      }
      .social-btn.instagram {
        --c: #e1306c;
      }
      .social-btn.x {
        --c: #fff;
      }
      .social-btn.tiktok {
        --c: #69c9d0;
      }
      .social-btn.github {
        --c: #6e40c9;
      }
      .social-btn:hover {
        border-color: var(--c, var(--primary));
        box-shadow: 0 0 12px
          color-mix(in srgb, var(--c, var(--primary)) 30%, transparent);
      }

      /* ===== CLAN INFO ===== */
      .clan-info {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .clan-badge-box {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 182, 193, 0.08);
        border: 1px solid var(--border);
        font-size: 1.8rem;
        flex-shrink: 0;
      }
      .clan-name {
        font-family: var(--font-cyber);
        font-size: 1rem;
        font-weight: 700;
      }
      .clan-tag {
        color: var(--primary);
        font-size: 0.8rem;
      }
      .clan-level {
        color: var(--text-muted);
        font-size: 0.78rem;
        margin-top: 4px;
      }

      /* ===== PRIVATE / NOT FOUND ===== */
      .portfolio-private {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
        gap: 16px;
      }
      .portfolio-private .lock-icon {
        font-size: 3rem;
        color: var(--text-muted);
      }
      .portfolio-private h2 {
        font-family: var(--font-cyber);
        font-size: 1.2rem;
      }
      .portfolio-private p {
        color: var(--text-muted);
        max-width: 360px;
        line-height: 1.6;
      }

      /* ===== EDIT MODE BANNER ===== */
      .edit-banner {
        background: rgba(255, 182, 193, 0.08);
        border: 1px solid rgba(255, 182, 193, 0.25);
        border-radius: 14px;
        padding: 14px 20px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .edit-banner-text {
        font-size: 0.88rem;
      }
      .edit-banner-text strong {
        color: var(--primary);
      }
      .toggle-public-btn {
        white-space: nowrap;
      }

      /* ===== LOADING ===== */
      .portfolio-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        gap: 16px;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255, 182, 193, 0.2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ===== SCROLLBAR ===== */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 182, 193, 0.2);
        border-radius: 3px;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 600px) {
        .hero-info {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        .hero-actions {
          align-self: auto;
        }
        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .card-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bg-particles"></canvas>

    <div class="portfolio-root">
      <!-- State: Loading -->
      <div id="state-loading" class="portfolio-loading">
        <div class="spinner"></div>
        <span style="color: var(--text-muted); font-size: 0.9rem"
          >Memuat portfolio...</span
        >
      </div>

      <!-- State: Private / Not Found -->
      <div id="state-private" class="portfolio-private" style="display: none">
        <i class="fas fa-lock lock-icon"></i>
        <h2>Portfolio Belum Dipublikasikan</h2>
        <p>
          Member ini belum mempublikasikan portfolio mereka, atau profil tidak
          ditemukan.
        </p>
        <a href="/" class="btn btn-ghost"
          ><i class="fas fa-home"></i> Kembali ke Dashboard</a
        >
      </div>

      <!-- State: Portfolio Content -->
      <div id="state-content" style="display: none">
        <!-- Edit Banner (hanya tampil jika viewer = pemilik) -->
        <div id="edit-banner" class="edit-banner" style="display: none">
          <div class="edit-banner-text">
            Ini adalah <strong>portfolio kamu</strong>.
            <span id="edit-public-status"></span>
          </div>
          <div style="display: flex; gap: 8px">
            <button
              class="btn btn-ghost"
              id="btn-edit-portfolio"
              onclick="window.location = '/portfolio/me/edit'"
            >
              <i class="fas fa-pen"></i> Edit
            </button>
            <button
              class="btn btn-primary toggle-public-btn"
              id="btn-toggle-public"
            >
              <i class="fas fa-globe"></i>
              <span id="toggle-label">Publikasikan</span>
            </button>
          </div>
        </div>

        <!-- Hero Section -->
        <div class="hero" id="hero-section">
          <div class="hero-banner" id="hero-banner">
            <div class="hero-banner-particles"></div>
          </div>
          <div class="hero-info">
            <div class="hero-avatar-wrap">
              <div
                id="premium-ring"
                class="hero-premium-ring"
                style="display: none"
              ></div>
              <img
                id="hero-avatar"
                class="hero-avatar"
                src="/assets/dashboard/naura.png"
                alt="Avatar"
              />
            </div>
            <div class="hero-details">
              <div id="hero-name" class="hero-name">-</div>
              <div id="hero-tagline" class="hero-tagline"></div>
              <div class="hero-badges" id="hero-badges"></div>
            </div>
          </div>
        </div>

        <!-- Bio -->
        <div class="bio-card" id="bio-card" style="display: none">
          <p id="bio-text"></p>
          <div class="view-count">
            <i class="fas fa-eye"></i> <span id="view-count-val">0</span> kali
            dilihat
          </div>
        </div>

        <!-- Sections rendered dynamically -->
        <div id="sections-container"></div>
      </div>
    </div>

    <script>
      // ================================================================
      // Particle Background
      // ================================================================
      (function () {
        const canvas = document.getElementById("bg-particles");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        for (let i = 0; i < 60; i++) {
          particles.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 1.5 + 0.3,
            dx: (Math.random() - 0.5) * 0.3,
            dy: (Math.random() - 0.5) * 0.3,
            alpha: Math.random() * 0.4 + 0.1,
          });
        }

        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,182,193,${p.alpha})`;
            ctx.fill();
            p.x += p.dx;
            p.y += p.dy;
            if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
          });
          requestAnimationFrame(draw);
        }
        draw();
      })();

      // ================================================================
      // Portfolio Loader
      // ================================================================
      (function () {
        const $ = (id) => document.getElementById(id);

        // Tentukan userId dari path: /u/:userId atau /portfolio (= diri sendiri)
        const pathParts = location.pathname.split("/").filter(Boolean);
        let targetUserId = null;
        let isSelfView = false;

        if (pathParts[0] === "u" && pathParts[1]) {
          targetUserId = pathParts[1];
        } else {
          // /portfolio atau /portfolio/me/edit → ambil dari session
          isSelfView = true;
        }

        async function fetchJSON(url) {
          const r = await fetch(url, { credentials: "include" });
          if (!r.ok)
            throw Object.assign(new Error(r.statusText), { status: r.status });
          return r.json();
        }

        function formatNumber(n) {
          if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
          if (n >= 1_000) return (n / 1_000).toFixed(1) + "K";
          return String(n || 0);
        }

        function formatDuration(ms) {
          const h = Math.floor(ms / 3_600_000);
          const m = Math.floor((ms % 3_600_000) / 60_000);
          if (h > 0) return `${h}j ${m}m`;
          return `${m}m`;
        }

        const ACHIEVEMENT_META = {
          first_kill: { icon: "⚔️", label: "Pembunuh Pertama" },
          first_dungeon: { icon: "🏰", label: "Penjelajah Dungeon" },
          level_10: { icon: "⭐", label: "Level 10" },
          level_50: { icon: "🌟", label: "Level 50" },
          millionaire: { icon: "💰", label: "Jutawan" },
          default: { icon: "🏅", label: "Pencapaian" },
        };

        const PET_SPECIES_EMOJI = {
          cat: "🐱",
          dog: "🐶",
          fox: "🦊",
          wolf: "🐺",
          dragon: "🐉",
          phoenix: "🦅",
          rabbit: "🐰",
          bear: "🐻",
          panda: "🐼",
          default: "🦋",
        };

        function buildEconomySection(stats) {
          const e = stats.economy;
          const s = stats.survival;
          return `
        <div class="stats-grid">
            <div class="stat-card gold">
                <div class="stat-value">${formatNumber(e.starFragments)}</div>
                <div class="stat-label">⭐ Star Fragments</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${formatNumber(e.coupons)}</div>
                <div class="stat-label">🎟️ Naura Coupon</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${formatNumber(e.wallet)}</div>
                <div class="stat-label">💵 Dompet</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${formatNumber(e.bank)}</div>
                <div class="stat-label">🏦 Bank</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-value">Lv.${s.level}</div>
                <div class="stat-label">⚔️ Level RPG</div>
            </div>
            <div class="stat-card blue">
                <div class="stat-value">Lv.${stats.leveling.level}</div>
                <div class="stat-label">💬 Level Chat</div>
            </div>
        </div>`;
        }

        function buildSurvivalSection(stats) {
          const s = stats.survival;
          const bars = [
            { label: "STR", val: s.strength, max: 100, color: "#FF6B6B" },
            { label: "AGI", val: s.agility, max: 100, color: "#86EFAC" },
            { label: "INT", val: s.intelligence, max: 100, color: "#93C5FD" },
            { label: "LCK", val: s.luck, max: 100, color: "#FFD700" },
          ];
          const statBars = bars
            .map(
              (b) => `
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                <span style="font-family:var(--font-cyber);font-size:0.7rem;color:var(--text-muted);width:26px">${b.label}</span>
                <div style="flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden">
                    <div style="width:${Math.min(b.val, 100)}%;height:100%;background:${b.color};border-radius:3px;transition:width 0.8s ease"></div>
                </div>
                <span style="font-size:0.78rem;color:var(--text-muted);width:24px;text-align:right">${b.val}</span>
            </div>
        `,
            )
            .join("");
          return `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
            <div>
                <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px">Lokasi: <strong style="color:var(--text)">${s.currentLocation}</strong></div>
                <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:4px">HP</div>
                <div style="height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin-bottom:12px">
                    <div style="width:${s.hp}%;height:100%;background:#86EFAC;border-radius:4px"></div>
                </div>
                <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:4px">Stamina</div>
                <div style="height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden">
                    <div style="width:${s.stamina}%;height:100%;background:#93C5FD;border-radius:4px"></div>
                </div>
            </div>
            <div>${statBars}</div>
        </div>`;
        }

        function buildMusicSection(stats) {
          const m = stats.music;
          return `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">${formatNumber(m.tracksListened)}</div>
                <div class="stat-label">🎵 Lagu Diputar</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-value">${formatDuration(m.totalDurationMs)}</div>
                <div class="stat-label">⏱️ Total Durasi</div>
            </div>
            <div class="stat-card" style="grid-column:span 2">
                <div class="stat-value" style="font-size:1rem">${m.favoriteGenre || "Belum Terdeteksi"}</div>
                <div class="stat-label">🎼 Genre Favorit</div>
            </div>
        </div>
        ${m.lastListened && m.lastListened !== "Belum ada lagu" ? `<div style="margin-top:12px;font-size:0.8rem;color:var(--text-muted)">🎧 Terakhir didengar: <strong style="color:var(--text)">${m.lastListened}</strong></div>` : ""}`;
        }

        function buildPetsSection(pets) {
          if (!pets || pets.length === 0) {
            return '<p style="color:var(--text-muted);font-size:0.88rem">Belum memiliki pet aktif.</p>';
          }
          return `<div class="pet-grid">${pets
            .map((pet) => {
              const emoji =
                PET_SPECIES_EMOJI[pet.species?.toLowerCase()] ||
                PET_SPECIES_EMOJI.default;
              return `
            <div class="pet-card">
                <div class="pet-emoji">${emoji}</div>
                <div class="pet-name">${pet.name || "Unnamed"}</div>
                <div class="pet-meta">${pet.species || "?"} · Lv.${pet.level || 1}</div>
                <div class="pet-meta">${pet.mood ? `Mood: ${pet.mood}` : ""}</div>
                ${pet.cosmicAura ? '<div class="pet-cosmic">✨ Cosmic Ascended</div>' : ""}
            </div>`;
            })
            .join("")}</div>`;
        }

        function buildCardsSection(cards, pinnedCardId) {
          if (!cards || cards.length === 0) {
            return '<p style="color:var(--text-muted);font-size:0.88rem">Belum memiliki kartu koleksi.</p>';
          }
          const sorted = [...cards].sort((a, b) => {
            if (a.id === pinnedCardId) return -1;
            if (b.id === pinnedCardId) return 1;
            const order = ["UR", "SSR", "SR", "R", "N"];
            return order.indexOf(a.rarity) - order.indexOf(b.rarity);
          });
          return `<div class="card-grid">${sorted
            .slice(0, 9)
            .map((card) => {
              const rarity = card.rarity || "N";
              const isPinned = card.id === pinnedCardId;
              return `
            <div class="tcg-card ${card.isAwakened ? "awakened" : ""}" title="${card.characterName || "?"}">
                <div class="tcg-rarity ${rarity}">${rarity}${isPinned ? " 📌" : ""}</div>
                <div class="tcg-char">${card.characterName || "???"}</div>
                <div class="tcg-series">${card.seriesName || ""}</div>
                ${card.isAwakened ? '<div style="font-size:0.65rem;color:var(--accent-gold);margin-top:3px">⚡ AWAKENED</div>' : ""}
            </div>`;
            })
            .join("")}</div>`;
        }

        function buildAchievementsSection(achievements) {
          if (!achievements || achievements.length === 0) {
            return '<p style="color:var(--text-muted);font-size:0.88rem">Belum ada pencapaian.</p>';
          }
          return `<div class="achievement-grid">${achievements
            .map((ach) => {
              const meta =
                ACHIEVEMENT_META[ach.achievementId] || ACHIEVEMENT_META.default;
              const date = ach.earnedAt
                ? new Date(ach.earnedAt).toLocaleDateString("id-ID", {
                    day: "numeric",
                    month: "short",
                    year: "2-digit",
                  })
                : "";
              return `
            <div class="ach-card">
                <div class="ach-icon">${meta.icon}</div>
                <div class="ach-name">${meta.label}</div>
                ${date ? `<div class="ach-date">${date}</div>` : ""}
            </div>`;
            })
            .join("")}</div>`;
        }

        function buildSocialSection(stats, portfolio) {
          const s = stats.social;
          const overrides = portfolio.socialLinks || {};
          const links = [
            {
              key: "youtube",
              icon: "fab fa-youtube",
              label: "YouTube",
              url: overrides.youtube || s.youtube,
              cls: "youtube",
            },
            {
              key: "instagram",
              icon: "fab fa-instagram",
              label: "Instagram",
              url: overrides.instagram || s.instagram,
              cls: "instagram",
            },
            {
              key: "x",
              icon: "fab fa-x-twitter",
              label: "X / Twitter",
              url: overrides.x || s.x,
              cls: "x",
            },
            {
              key: "tiktok",
              icon: "fab fa-tiktok",
              label: "TikTok",
              url: overrides.tiktok,
              cls: "tiktok",
            },
            {
              key: "github",
              icon: "fab fa-github",
              label: "GitHub",
              url: overrides.github,
              cls: "github",
            },
          ].filter((l) => l.url);

          if (links.length === 0)
            return '<p style="color:var(--text-muted);font-size:0.88rem">Belum ada link sosial media.</p>';
          return `<div class="social-links">${links
            .map(
              (l) => `
            <a href="${l.url}" target="_blank" rel="noopener" class="social-btn ${l.cls}">
                <i class="${l.icon}"></i> ${l.label}
            </a>`,
            )
            .join("")}</div>`;
        }

        function buildClanSection(clan) {
          if (!clan)
            return '<p style="color:var(--text-muted);font-size:0.88rem">Tidak tergabung dalam klan.</p>';
          return `<div class="clan-info">
            <div class="clan-badge-box">🏰</div>
            <div>
                <div class="clan-name">${clan.name}</div>
                <div class="clan-tag">[${clan.tag || "---"}]</div>
                <div class="clan-level">Level ${clan.level || 1}${clan.description ? " · " + clan.description : ""}</div>
            </div>
        </div>`;
        }

        const SECTION_DEFS = {
          economy: {
            icon: "💰",
            title: "Ekonomi & Level",
            build: (d) => buildEconomySection(d.stats),
          },
          survival: {
            icon: "⚔️",
            title: "Status Survival",
            build: (d) => buildSurvivalSection(d.stats),
          },
          music: {
            icon: "🎵",
            title: "Profil Musik",
            build: (d) => buildMusicSection(d.stats),
          },
          pets: {
            icon: "🐾",
            title: "Pet Aktif",
            build: (d) => buildPetsSection(d.pets),
          },
          cards: {
            icon: "🃏",
            title: "Koleksi Kartu",
            build: (d) => buildCardsSection(d.cards, d.portfolio.pinnedCardId),
          },
          achievements: {
            icon: "🏅",
            title: "Pencapaian",
            build: (d) => buildAchievementsSection(d.achievements),
          },
          clan: {
            icon: "🏰",
            title: "Klan",
            build: (d) => buildClanSection(d.clan),
          },
          social: {
            icon: "🌐",
            title: "Sosial Media",
            build: (d) => buildSocialSection(d.stats, d.portfolio),
          },
          minigames: {
            icon: "🎮",
            title: "Mini-Game",
            build: (d) => `<div class="stats-grid">
                <div class="stat-card"><div class="stat-value">${formatNumber(d.stats.minigames.triviaScore)}</div><div class="stat-label">🎯 Trivia Score</div></div>
                <div class="stat-card"><div class="stat-value">${formatNumber(d.stats.minigames.duelScore)}</div><div class="stat-label">⚔️ Duel Score</div></div>
                <div class="stat-card"><div class="stat-value">${d.stats.minigames.rpsWin}</div><div class="stat-label">✂️ RPS Win</div></div>
            </div>`,
          },
        };

        function applyTheme(portfolio, user) {
          const theme = portfolio.theme || "default";
          const accent =
            user.isPremium && portfolio.accentColor
              ? portfolio.accentColor
              : null;

          const themes = {
            sakura: {
              bg: "linear-gradient(135deg, #1a0a14 0%, #2a0d1e 50%, #1a0a14 100%)",
            },
            cyber: {
              bg: "linear-gradient(135deg, #020b1a 0%, #051428 50%, #0a0520 100%)",
            },
            midnight: {
              bg: "linear-gradient(135deg, #050510 0%, #080820 50%, #050510 100%)",
            },
            default: { bg: "" },
          };

          const t = themes[theme] || themes.default;
          if (t.bg) document.body.style.background = t.bg;
          if (accent) {
            document.documentElement.style.setProperty("--primary", accent);
            const r = parseInt(accent.slice(1, 3), 16);
            const g = parseInt(accent.slice(3, 5), 16);
            const b = parseInt(accent.slice(5, 7), 16);
            document.documentElement.style.setProperty(
              "--primary-glow",
              `rgba(${r},${g},${b},0.35)`,
            );
          }

          // Background image (premium)
          if (
            user.isPremium &&
            portfolio.bgType === "image" &&
            portfolio.bgValue
          ) {
            $("hero-banner").style.backgroundImage =
              `url('${portfolio.bgValue}')`;
            $("hero-banner").style.backgroundSize = "cover";
            $("hero-banner").style.backgroundPosition = "center";
          }
        }

        async function render() {
          try {
            let data;
            if (isSelfView) {
              data = await fetchJSON("/api/portfolio/me");
            } else {
              data = await fetchJSON(`/api/portfolio/${targetUserId}`);
            }

            const { user, portfolio, stats, pets, cards, achievements, clan } =
              data;

            // Atur tema
            applyTheme(portfolio, user);

            // Judul halaman
            document.title = `${user.displayName}, Naura Portfolio`;

            // Hero
            $("hero-avatar").src = user.avatar || "/assets/dashboard/naura.png";
            $("hero-avatar").alt = user.displayName;
            $("hero-name").textContent = user.displayName;

            if (portfolio.tagline)
              $("hero-tagline").textContent = portfolio.tagline;

            if (user.isPremium) {
              $("premium-ring").style.display = "block";
              const premBadge = document.createElement("span");
              premBadge.className = "badge badge-premium";
              premBadge.innerHTML = "💎 Premium";
              $("hero-badges").appendChild(premBadge);
            }

            if (user.isPremium && portfolio.customBadge) {
              const customBadge = document.createElement("span");
              customBadge.className = "badge badge-custom";
              customBadge.textContent = portfolio.customBadge;
              $("hero-badges").appendChild(customBadge);
            }

            if (portfolio.isPublic) {
              const pubBadge = document.createElement("span");
              pubBadge.className = "badge badge-public";
              pubBadge.innerHTML =
                '<i class="fas fa-globe" style="font-size:0.6rem"></i> Publik';
              $("hero-badges").appendChild(pubBadge);
            }

            // Bio
            if (portfolio.bio) {
              $("bio-text").textContent = portfolio.bio;
              $("view-count-val").textContent = formatNumber(
                portfolio.viewCount,
              );
              $("bio-card").style.display = "block";
            }

            // Edit banner (hanya jika ini portfolio diri sendiri)
            if (
              isSelfView ||
              (targetUserId && window.__sessionUserId === targetUserId)
            ) {
              const banner = $("edit-banner");
              banner.style.display = "flex";
              $("edit-public-status").textContent = portfolio.isPublic
                ? "Portfolio ini sudah publik."
                : "Portfolio ini masih tersembunyi.";
              $("toggle-label").textContent = portfolio.isPublic
                ? "Sembunyikan"
                : "Publikasikan";

              $("btn-toggle-public").onclick = async () => {
                try {
                  const r = await fetch("/api/portfolio/me/toggle", {
                    method: "POST",
                    credentials: "include",
                  });
                  const result = await r.json();
                  if (result.success) location.reload();
                } catch (e) {
                  alert("Gagal mengubah status portfolio.");
                }
              };
            }

            // Render sections
            const sections = portfolio.showcaseSections || [
              "economy",
              "music",
              "cards",
              "achievements",
            ];
            const container = $("sections-container");

            sections.forEach((key) => {
              const def = SECTION_DEFS[key];
              if (!def) return;

              const sec = document.createElement("div");
              sec.className = "section";
              sec.innerHTML = `
                    <div class="section-header">
                        <div class="section-icon">${def.icon}</div>
                        <div class="section-title">${def.title}</div>
                    </div>
                    ${def.build({ stats, pets, cards, achievements, clan, portfolio })}
                `;
              container.appendChild(sec);
            });

            // Show content
            $("state-loading").style.display = "none";
            $("state-content").style.display = "block";
          } catch (err) {
            $("state-loading").style.display = "none";
            if (err.status === 404 || err.status === 403) {
              $("state-private").style.display = "flex";
            } else {
              $("state-private").style.display = "flex";
              $("state-private").querySelector("h2").textContent =
                "Terjadi Kesalahan";
              $("state-private").querySelector("p").textContent =
                "Naura tidak dapat memuat portfolio ini. Coba lagi nanti.";
            }
          }
        }

        // Cek session user untuk edit banner
        fetch("/api/me", { credentials: "include" })
          .then((r) => r.json())
          .then((me) => {
            if (me.loggedIn) window.__sessionUserId = me.user?.id;
          })
          .catch(() => {})
          .finally(() => render());
      })();
    </script>
  </body>
</html>
