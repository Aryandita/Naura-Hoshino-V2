<!doctype html>
<html lang="id" data-theme="midnight" data-font-size="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="Lihat posisi rankingmu dan perbandingan dengan top server Discord." />
    <title>Leaderboard | Naura OS Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/mobile.css" />
  </head>

  <body>
    <header class="nm-header" role="banner">
      <div class="nm-header__brand">
        <i class="fa-solid fa-ranking-star" style="color:var(--accent-purple);font-size:1.1rem" aria-hidden="true"></i>
        <span class="nm-header__name" style="text-shadow:0 0 12px rgba(192,132,252,0.6)">RANKING</span>
      </div>
    </header>

    <main class="nm-page" role="main" style="padding-top:var(--sp-xs)">

      <!-- Filter tipe -->
      <div role="group" aria-label="Filter kategori ranking" class="animate-fade-in-up">
        <div class="nm-filter-chips">
          <button class="nm-filter-chip nm-filter-chip--active nm-lb-filter" data-filter="nc" aria-pressed="true">💰 NC</button>
          <button class="nm-filter-chip nm-lb-filter" data-filter="xp"  aria-pressed="false">⭐ XP</button>
          <button class="nm-filter-chip nm-lb-filter" data-filter="nsf" aria-pressed="false">🌿 NSF</button>
          <button class="nm-filter-chip nm-lb-filter" data-filter="quest" aria-pressed="false">📜 Quest</button>
        </div>
      </div>

      <!-- Filter rentang waktu -->
      <div role="group" aria-label="Filter rentang waktu" class="animate-fade-in-up" style="animation-delay:40ms">
        <div class="nm-filter-chips">
          <button class="nm-filter-chip nm-filter-chip--active nm-lb-filter" data-range="all"  aria-pressed="true">Semua Waktu</button>
          <button class="nm-filter-chip nm-lb-filter" data-range="week"  aria-pressed="false">Minggu Ini</button>
          <button class="nm-filter-chip nm-lb-filter" data-range="month" aria-pressed="false">Bulan Ini</button>
        </div>
      </div>

      <!-- Top 3 Highlight -->
      <section aria-label="Top 3 pemain" class="reveal animate-fade-in-up" style="animation-delay:80ms">
        <p class="nm-section-title">Top Pemain</p>
        <div id="lb-top3" style="display:flex;flex-direction:column;gap:var(--sp-xs)">
          <div class="nm-skeleton" style="height:64px;border-radius:var(--r-xl)"></div>
          <div class="nm-skeleton" style="height:64px;border-radius:var(--r-xl);animation-delay:80ms"></div>
          <div class="nm-skeleton" style="height:64px;border-radius:var(--r-xl);animation-delay:160ms"></div>
        </div>
      </section>

      <!-- List #4 dst. -->
      <section aria-label="Daftar peringkat" class="reveal animate-fade-in-up" style="animation-delay:120ms">
        <p class="nm-section-title">Peringkat Lengkap</p>
        <div class="nm-lb-list" id="lb-list">
          <!-- Diisi leaderboard.js, termasuk sticky self-row -->
        </div>
      </section>

    </main>

    <nav id="nm-bottom-nav" aria-label="Navigasi utama"></nav>
    <div id="nm-toast-container" role="region" aria-label="Notifikasi" aria-live="polite"></div>
    <script type="module" src="../js/pages/leaderboard.js"></script>
  </body>
</html>
