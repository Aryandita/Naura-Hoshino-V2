<!doctype html>
<html lang="id" data-theme="midnight" data-font-size="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="Kelola isi ransel, material bertahan hidup, dan peralatan Naura Wilds." />
    <title>Ransel Petualang | Naura OS Mobile</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Design System -->
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/mobile.css" />

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
  </head>

  <body>
    <!-- ── App Shell ── -->
    <header class="nm-header" role="banner">
      <div class="nm-header__brand">
        <a href="/mobile/survival" class="nm-header__btn" aria-label="Kembali" style="text-decoration:none">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </a>
        <span class="nm-header__name">Ransel & Tas</span>
      </div>
      <div class="nm-header__actions">
        <button class="nm-header__btn" id="nm-open-customizer" aria-label="Kustomisasi tampilan">
          <i class="fa-solid fa-palette" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- ── Main Content ── -->
    <main class="nm-page" role="main" style="padding-top: var(--sp-xs)">

      <!-- Capacity & Quick Summary Card -->
      <section class="nm-card animate-fade-in-up" style="border-color: rgba(251, 191, 36, 0.25)">
        <div class="nm-card__header">
          <div>
            <span class="nm-badge nm-badge--gold"><i class="fa-solid fa-box-archive"></i> Kapasitas Tas</span>
            <h2 class="nm-card__title" style="margin-top:4px">Inventaris Petualang</h2>
          </div>
          <span id="nm-inv-slots" class="nm-chip__value" style="font-size:1.1rem; color:var(--accent-gold)">--/30 Slot</span>
        </div>

        <div class="nm-progress" style="margin: var(--sp-sm) 0 4px; height:8px">
          <div id="nm-inv-progress" class="nm-progress__bar nm-progress__bar--emerald" style="width: 0%"></div>
        </div>
        <p class="nm-caption" id="nm-inv-weight-desc" style="color:var(--muted)">Memuat data ransel...</p>
      </section>

      <!-- Survival Tools Durability Widget -->
      <section class="nm-card animate-fade-in-up" style="animation-delay: 60ms">
        <div class="nm-card__header">
          <h3 class="nm-card__title" style="font-size:0.95rem">
            <i class="fa-solid fa-screwdriver-wrench" style="color:var(--wilds-moss)"></i> Ketahanan Peralatan
          </h3>
          <span class="nm-caption" style="color:var(--muted)">Auto-Repair di Kafe</span>
        </div>

        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:var(--sp-xs); margin-top:var(--sp-xs)">
          <!-- Pickaxe -->
          <div class="nm-card" style="padding:var(--sp-xs); background:rgba(255,255,255,0.02); text-align:center">
            <i class="fa-solid fa-hammer" style="color:#fbbf24; font-size:1.1rem"></i>
            <div style="font-size:0.75rem; font-weight:600; margin-top:4px">Beliung</div>
            <div id="tool-pickaxe-dura" style="font-size:0.7rem; color:var(--wilds-emerald); font-family:var(--font-mono)">100%</div>
          </div>
          <!-- Axe -->
          <div class="nm-card" style="padding:var(--sp-xs); background:rgba(255,255,255,0.02); text-align:center">
            <i class="fa-solid fa-axe" style="color:#f87171; font-size:1.1rem"></i>
            <div style="font-size:0.75rem; font-weight:600; margin-top:4px">Kapak</div>
            <div id="tool-axe-dura" style="font-size:0.7rem; color:var(--wilds-emerald); font-family:var(--font-mono)">100%</div>
          </div>
          <!-- Rod -->
          <div class="nm-card" style="padding:var(--sp-xs); background:rgba(255,255,255,0.02); text-align:center">
            <i class="fa-solid fa-fish" style="color:#60a5fa; font-size:1.1rem"></i>
            <div style="font-size:0.75rem; font-weight:600; margin-top:4px">Pancing</div>
            <div id="tool-rod-dura" style="font-size:0.7rem; color:var(--wilds-emerald); font-family:var(--font-mono)">100%</div>
          </div>
        </div>
      </section>

      <!-- Filter Tabs -->
      <div class="nm-tabs" role="tablist" style="margin-top:var(--sp-xs)">
        <button class="nm-tab is-active" data-filter="all" role="tab">Semua</button>
        <button class="nm-tab" data-filter="material" role="tab">Material</button>
        <button class="nm-tab" data-filter="consumable" role="tab">Konsumsi</button>
        <button class="nm-tab" data-filter="equipment" role="tab">Langka</button>
      </div>

      <!-- Inventory Grid -->
      <section aria-label="Daftar item ransel">
        <div id="nm-inventory-grid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:var(--sp-xs)">
          <!-- Skeleton Loading -->
          <div class="nm-card nm-skeleton" style="height:90px"></div>
          <div class="nm-card nm-skeleton" style="height:90px; animation-delay:60ms"></div>
          <div class="nm-card nm-skeleton" style="height:90px; animation-delay:120ms"></div>
        </div>
      </section>

    </main>

    <!-- Bottom Navigation -->
    <nav id="nm-bottom-nav" aria-label="Navigasi utama"></nav>

    <!-- Toast Container -->
    <div id="nm-toast-container" role="region" aria-label="Notifikasi" aria-live="polite"></div>

    <!-- Page Script -->
    <script type="module" src="../js/pages/inventory.js"></script>
  </body>
</html>
