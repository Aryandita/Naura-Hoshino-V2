<!doctype html>
<html lang="id" data-theme="midnight" data-font-size="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="Mainkan mini-game arcade retro dan kumpulkan Star Fragments di Naura Wilds." />
    <title>Retro Arcade | Naura OS Mobile</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Design System -->
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/mobile.css" />

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
      .arcade-canvas-box {
        position: relative;
        width: 100%;
        height: 280px;
        background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090a10 100%);
        border: 1px solid rgba(244, 63, 94, 0.4);
        border-radius: var(--r-lg);
        overflow: hidden;
        touch-action: none;
        box-shadow: 0 8px 30px rgba(244, 63, 94, 0.15);
      }
      #arcade-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .arcade-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(11, 12, 16, 0.85);
        backdrop-filter: blur(4px);
        transition: opacity 0.2s ease;
      }
      .arcade-overlay.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- ── App Shell ── -->
    <header class="nm-header" role="banner">
      <div class="nm-header__brand">
        <a href="/mobile/" class="nm-header__btn" aria-label="Kembali" style="text-decoration:none">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </a>
        <span class="nm-header__name">Retro Arcade</span>
      </div>
      <div class="nm-header__actions">
        <button class="nm-header__btn" id="nm-open-customizer" aria-label="Kustomisasi tampilan">
          <i class="fa-solid fa-palette" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- ── Main Content ── -->
    <main class="nm-page" role="main" style="padding-top: var(--sp-xs)">

      <!-- Game Stage Card -->
      <section class="nm-card animate-fade-in-up" style="border-color: rgba(244, 63, 94, 0.3)">
        <div class="nm-card__header">
          <div>
            <span class="nm-badge nm-badge--pink"><i class="fa-solid fa-gamepad"></i> Mini-Game Retro</span>
            <h2 class="nm-card__title" style="margin-top:4px">Cyber Star Catcher</h2>
          </div>
          <div style="text-align:right">
            <span class="nm-caption" style="color:var(--muted)">Skor Terkini</span>
            <div id="game-score" style="font-size:1.25rem; font-weight:900; color:var(--accent-pink); font-family:var(--font-mono)">0</div>
          </div>
        </div>

        <!-- Canvas Container -->
        <div class="arcade-canvas-box" style="margin-top:var(--sp-xs)">
          <canvas id="arcade-canvas"></canvas>
          <div id="game-overlay" class="arcade-overlay">
            <img src="/assets/Naura_Expression/Cheers.png" alt="Naura Semangat" style="width:70px; height:70px; margin-bottom:var(--sp-xs)">
            <h3 style="font-size:1rem; font-weight:700; color:var(--ink); margin-bottom:4px">Siap Menangkap Bintang?</h3>
            <p style="font-size:0.75rem; color:var(--body); text-align:center; max-width:24ch; margin-bottom:var(--sp-sm)">
              Geser jarimu ke kiri atau kanan untuk menangkap bintang kosmik!
            </p>
            <button id="btn-start-game" class="nm-btn nm-btn--primary">
              <i class="fa-solid fa-play"></i> Mulai Main (30s)
            </button>
          </div>
        </div>

        <!-- Game Controls & Exchange Bar -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:var(--sp-sm)">
          <div style="font-size:0.75rem; color:var(--muted)">
            Sisa Waktu: <span id="game-timer" style="font-family:var(--font-mono); color:var(--wilds-emerald); font-weight:700">30s</span>
          </div>
          <button id="btn-claim-reward" class="nm-btn nm-btn--sm nm-btn--glass" disabled>
            <i class="fa-solid fa-gift"></i> Tukar Hadiah NSF
          </button>
        </div>
      </section>

      <!-- Arcade Leaderboard Card -->
      <section class="nm-card animate-fade-in-up" style="animation-delay:60ms">
        <div class="nm-card__header">
          <h3 class="nm-card__title" style="font-size:0.95rem">
            <i class="fa-solid fa-trophy" style="color:var(--accent-gold)"></i> Jawara Arcade Minggu Ini
          </h3>
          <span class="nm-badge nm-badge--gold">Top 5</span>
        </div>

        <div id="arcade-leaderboard-list" style="display:flex; flex-direction:column; gap:var(--sp-xs); margin-top:var(--sp-xs)">
          <!-- Skeleton Loading -->
          <div class="nm-card nm-skeleton" style="height:44px"></div>
          <div class="nm-card nm-skeleton" style="height:44px; animation-delay:60ms"></div>
        </div>
      </section>

    </main>

    <!-- Bottom Navigation -->
    <nav id="nm-bottom-nav" aria-label="Navigasi utama"></nav>

    <!-- Toast Container -->
    <div id="nm-toast-container" role="region" aria-label="Notifikasi" aria-live="polite"></div>

    <!-- Page Script -->
    <script type="module" src="../js/pages/arcade.js"></script>
  </body>
</html>
