<!doctype html>
<html lang="id" data-theme="midnight" data-font-size="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="Pantau kondisi bot Naura Hoshino dan server Discord kamu secara real-time." />
    <title>Beranda | Naura OS Mobile</title>

    <!-- Fonts (preload untuk performa) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />


    <!-- Font Awesome (self-hosted via vendor FA free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Design System -->
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/mobile.css" />

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
  </head>

  <body>
    <!-- ── App Shell ── -->
    <header class="nm-header" role="banner">
      <div class="nm-header__brand">
        <img src="/assets/core/avatar.png"
             alt="Naura Hoshino avatar" class="nm-header__avatar"
             id="nm-header-avatar" width="32" height="32" />
        <span class="nm-header__name" id="nm-header-name">Naura OS</span>
        <div class="nm-dot nm-dot--online" id="nm-header-dot" title="Bot online"></div>
      </div>
      <div class="nm-header__actions">
        <button class="nm-header__btn" id="nm-open-customizer"
                aria-label="Kustomisasi tampilan" title="Kustomisasi">
          <i class="fa-solid fa-palette" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- ── Main Page Content ── -->
    <main class="nm-page" role="main" style="padding-top: var(--sp-xs)">

      <!-- Sapaan -->
      <div class="nm-greeting animate-fade-in-up">
        <div class="nm-greeting__text">
          <h1 class="nm-greeting__title" id="nm-greeting-title">
            Selamat datang~
          </h1>
          <p class="nm-greeting__sub">Dashboard Naura Hoshino V2</p>
        </div>
        <img id="nm-greeting-expr"
             src="/assets/Naura_Expression/Cheers.png"
             alt="Naura menyapa"
             class="nm-greeting__expr"
             width="80" height="80" />
      </div>

      <!-- Telemetry Strip -->
      <section aria-label="Telemetri bot" class="animate-fade-in-up reveal" style="animation-delay:60ms">
        <div class="nm-telemetry-strip" role="list">
          <div class="nm-chip" role="listitem">
            <span class="nm-chip__value" id="chip-ping">---</span>
            <span class="nm-chip__label">Ping</span>
          </div>
          <div class="nm-chip" role="listitem">
            <span class="nm-chip__value" id="chip-memory">---</span>
            <span class="nm-chip__label">Memori</span>
          </div>
          <div class="nm-chip" role="listitem">
            <span class="nm-chip__value" id="chip-guilds">---</span>
            <span class="nm-chip__label">Server</span>
          </div>
          <div class="nm-chip" role="listitem">
            <span class="nm-chip__value" id="chip-uptime">---</span>
            <span class="nm-chip__label">Uptime</span>
          </div>
        </div>
      </section>

      <!-- Widget Grid (diisi oleh home.js berdasarkan localStorage widget order) -->
      <section aria-label="Widget dashboard" class="nm-widget-grid reveal" id="nm-widget-grid">
        <!-- Skeleton sementara -->
        <div class="nm-card nm-skeleton" style="height:80px"></div>
        <div class="nm-card nm-skeleton" style="height:60px;animation-delay:80ms"></div>
        <div class="nm-card nm-skeleton" style="height:100px;animation-delay:160ms"></div>
      </section>

    </main>

    <!-- ── Bottom Navigation ── -->
    <nav id="nm-bottom-nav" aria-label="Navigasi utama"></nav>

    <!-- ── Toast Container ── -->
    <div id="nm-toast-container" role="region" aria-label="Notifikasi" aria-live="polite"></div>

    <!-- Page Script (ES module, Vite bundling) -->
    <script type="module" src="../js/pages/home.js"></script>
  </body>
</html>
