<!doctype html>
<html lang="id" data-theme="midnight" data-font-size="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="Kelola saldo NC, transfer koin, dan pantau kondisi ekonomi server Discord." />
    <title>Ekonomi | Naura OS Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/mobile.css" />
  </head>

  <body>
    <header class="nm-header" role="banner">
      <div class="nm-header__brand">
        <i class="fa-solid fa-coins" style="color:var(--accent-gold);font-size:1.1rem" aria-hidden="true"></i>
        <span class="nm-header__name" style="text-shadow:0 0 12px rgba(255,215,0,0.5)">EKONOMI</span>
      </div>
    </header>

    <main class="nm-page" role="main" style="padding-top:var(--sp-xs)">

      <!-- Wallet Card -->
      <section class="reveal nm-card animate-fade-in-up" aria-label="Dompet saya">
        <p class="nm-section-title">Dompetku</p>
        <div class="nm-wallet-grid" style="margin-bottom:var(--sp-md)">
          <div class="nm-wallet-item">
            <span class="nm-wallet-item__label">💰 Dompet</span>
            <span class="nm-wallet-item__value" id="eco-wallet">---</span>
          </div>
          <div class="nm-wallet-item">
            <span class="nm-wallet-item__label">🏦 Bank</span>
            <span class="nm-wallet-item__value" id="eco-bank">---</span>
          </div>
        </div>
        <div style="display:flex;gap:var(--sp-xs)">
          <button class="nm-btn nm-btn--ghost" style="flex:1;font-size:0.75rem;padding:10px 8px;min-height:44px" id="eco-btn-transfer">
            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Transfer
          </button>
          <button class="nm-btn nm-btn--ghost" style="flex:1;font-size:0.75rem;padding:10px 8px;min-height:44px" id="eco-btn-deposit">
            <i class="fa-solid fa-piggy-bank" aria-hidden="true"></i> Setor
          </button>
          <button class="nm-btn nm-btn--ghost" style="flex:1;font-size:0.75rem;padding:10px 8px;min-height:44px" id="eco-btn-withdraw">
            <i class="fa-solid fa-money-bill-wave" aria-hidden="true"></i> Tarik
          </button>
        </div>
        <!-- Quick preset chips -->
        <div class="nm-quick-chips" id="eco-main-chips" style="margin-top:var(--sp-sm)"></div>
      </section>

      <!-- Server Treasury Info -->
      <section class="reveal nm-card animate-fade-in-up" style="animation-delay:80ms" aria-label="Kas server">
        <p class="nm-section-title" style="margin-bottom:var(--sp-sm)">Kas Server</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-xs)">
          <div class="nm-wallet-item">
            <span class="nm-wallet-item__label">🏗 Infrastruktur</span>
            <span id="treasury-infra" class="nm-wallet-item__value" style="font-size:0.875rem">---</span>
          </div>
          <div class="nm-wallet-item">
            <span class="nm-wallet-item__label">🎰 Undian</span>
            <span id="treasury-lottery" class="nm-wallet-item__value" style="font-size:0.875rem">---</span>
          </div>
          <div class="nm-wallet-item">
            <span class="nm-wallet-item__label">💊 Subsidi</span>
            <span id="treasury-subsidy" class="nm-wallet-item__value" style="font-size:0.875rem">---</span>
          </div>
          <div class="nm-wallet-item">
            <span class="nm-wallet-item__label">🛒 Merchant</span>
            <span id="treasury-merchant" class="nm-wallet-item__value" style="font-size:0.875rem">---</span>
          </div>
        </div>
      </section>

    </main>

    <nav id="nm-bottom-nav" aria-label="Navigasi utama"></nav>
    <div id="nm-toast-container" role="region" aria-label="Notifikasi" aria-live="polite"></div>
    <script type="module" src="../js/pages/economy.js"></script>
  </body>
</html>
