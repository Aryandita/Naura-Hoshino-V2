<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galactic Marketplace & Auction House | Naura OS</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/src/css/stellar.css" />
    <style>
      .market-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }
      .market-header {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(16, 185, 129, 0.1) 100%);
        border: 1px solid var(--border-medium);
        border-radius: var(--r-xl);
        padding: 28px;
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        backdrop-filter: blur(16px);
      }
      .filter-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
        align-items: center;
      }
      .market-search {
        flex: 1;
        min-width: 260px;
        background: var(--bg-surface);
        border: 1px solid var(--border-medium);
        border-radius: var(--r-md);
        padding: 10px 16px;
        color: var(--text-primary);
        font-size: 14px;
        outline: none;
      }
      .market-search:focus {
        border-color: var(--primary);
      }
      .filter-btn {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        padding: 8px 16px;
        border-radius: var(--r-md);
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
      }
      .filter-btn.active, .filter-btn:hover {
        background: var(--primary-dim);
        border-color: var(--border-primary);
        color: var(--primary);
      }
      .auction-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
      }
      .auction-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-lg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      }
      .auction-card:hover {
        transform: translateY(-3px);
        border-color: var(--primary);
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      }
      .item-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }
      .badge-mythic { background: rgba(239, 68, 68, 0.2); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.4); }
      .badge-legendary { background: rgba(245, 158, 11, 0.2); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.4); }
      .badge-rare { background: rgba(167, 139, 250, 0.2); color: #A78BFA; border: 1px solid rgba(167, 139, 250, 0.4); }
      .badge-common { background: rgba(148, 163, 184, 0.2); color: #94A3B8; border: 1px solid rgba(148, 163, 184, 0.4); }
      .price-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 12px 0 16px;
        padding-top: 12px;
        border-top: 1px solid var(--border-subtle);
      }
      .price-val {
        font-family: var(--font-mono);
        font-size: 18px;
        font-weight: 700;
        color: #F59E0B;
      }
      .buyout-val {
        font-family: var(--font-mono);
        font-size: 13px;
        color: #10B981;
      }
    </style>
  </head>
  <body>
    <div id="shared-nav"></div>

    <main class="market-container">
      <!-- Header -->
      <section class="market-header">
        <div>
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
            <span style="font-size:28px;">🏛️</span>
            <h1 style="margin:0; font-size:26px; font-family:var(--font-heading);">Balai Lelang Galaksi</h1>
          </div>
          <p style="margin:0; color:var(--text-secondary); font-size:14px;">
            Pusat transaksi jual-beli komoditas, relik kuno, dan hasil bumi Naura Wilds antar petualang lintas server.
          </p>
        </div>
        <div>
          <button class="btn btn-primary" onclick="alert('Buka Discord dan ketik /survival auction create untuk memasang lelang!')">
            <i class="fa-solid fa-plus"></i> Pasang Barang (Discord)
          </button>
        </div>
      </section>

      <!-- Filter & Search Bar -->
      <section class="filter-bar">
        <input type="text" id="market-search" class="market-search" placeholder="🔍 Cari nama barang, relik, atau penjual..." oninput="filterMarket()" />
        <button class="filter-btn active" onclick="setCategory('all')">Semua</button>
        <button class="filter-btn" onclick="setCategory('weapon')">⚔️ Senjata & Alat</button>
        <button class="filter-btn" onclick="setCategory('material')">💎 Mineral & Material</button>
        <button class="filter-btn" onclick="setCategory('crop')">🌾 Hasil Panen</button>
        <button class="filter-btn" onclick="setCategory('relic')">🔮 Relik & Kartu</button>
      </section>

      <!-- Auction Cards Grid -->
      <section class="auction-grid" id="auction-grid">
        <div style="grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-muted);">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: var(--primary); margin-bottom: 10px;"></i>
          <div>Menghubungkan ke bursa pasar dan balai lelang galaksi...</div>
        </div>
      </section>
    </main>

    <script src="/src/js/sharedNav.js"></script>
    <script src="/js/theme-switcher.js"></script>
    <script src="/js/pwa-install.js"></script>
    <script>
      let activeCategory = 'all';
      let marketItems = [];

      async function loadMarketplace() {
        const grid = document.getElementById('auction-grid');
        try {
          const res = await fetch('/api/marketplace/items');
          const data = await res.json();

          if (data && data.success && Array.isArray(data.items)) {
            marketItems = data.items;
            renderMarketItems();
          } else {
            renderEmptyMarket();
          }
        } catch (err) {
          renderEmptyMarket();
        }
      }

      function renderMarketItems() {
        const grid = document.getElementById('auction-grid');
        if (!grid) return;

        const query = (document.getElementById('market-search')?.value || '').toLowerCase().trim();
        const filtered = marketItems.filter(item => {
          const cat = (item.category || 'material').toLowerCase();
          const matchCat = activeCategory === 'all' || cat.includes(activeCategory);
          const matchQuery = !query || 
            item.name.toLowerCase().includes(query) || 
            (item.sellerName && item.sellerName.toLowerCase().includes(query)) ||
            (item.description && item.description.toLowerCase().includes(query));
          return matchCat && matchQuery;
        });

        if (filtered.length === 0) {
          renderEmptyMarket();
          return;
        }

        grid.innerHTML = filtered.map(item => {
          const rarity = (item.rarity || 'Rare').toLowerCase();
          const badgeClass = rarity.includes('mythic') ? 'badge-mythic' : (rarity.includes('legend') ? 'badge-legendary' : 'badge-rare');
          const cur = item.currency || 'NSF';
          const buyHtml = item.buyoutPrice
            ? `<div class="buyout-val">${Number(item.buyoutPrice).toLocaleString('id-ID')} ${cur}</div>`
            : `<div style="font-size:12px; color:var(--text-muted);">-</div>`;

          return `
            <div class="auction-card" data-category="${item.category || 'material'}">
              <div>
                <span class="item-badge ${badgeClass}">${item.rarity || 'Rare'}</span>
                <h3 style="margin:4px 0 6px; font-family:var(--font-heading); font-size:17px;">${item.name} ${item.amount > 1 ? `x${item.amount}` : ''}</h3>
                <p style="margin:0; font-size:13px; color:var(--text-secondary);">${item.description || 'Barang komoditas lelang Naura Wilds.'}</p>
                <div style="font-size:12px; color:var(--text-muted); margin-top:6px;">Penjual: <strong>${item.sellerName || 'Anonim'}</strong></div>
              </div>
              <div>
                <div class="price-row">
                  <div>
                    <div style="font-size:11px; color:var(--text-muted);">TAWARAN SAAT INI</div>
                    <div class="price-val">${Number(item.currentBid || 0).toLocaleString('id-ID')} ${cur}</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="font-size:11px; color:var(--text-muted);">BELI INSTAN</div>
                    ${buyHtml}
                  </div>
                </div>
                <button class="btn btn-secondary" style="width:100%; font-size:13px;" onclick="alert('Ketik /survival auction bid id:${item.id} di Discord!')">
                  <i class="fa-solid fa-gavel"></i> Tawar di Discord
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderEmptyMarket() {
        const grid = document.getElementById('auction-grid');
        if (!grid) return;
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 48px 20px; color: var(--text-muted);">
            <i class="fa-solid fa-gavel" style="font-size: 32px; margin-bottom: 12px; display: block; opacity: 0.5;"></i>
            <h3 style="margin: 0 0 6px; font-family: var(--font-heading); color: var(--text-primary); font-size: 18px;">Belum Ada Lelang Aktif</h3>
            <p style="margin: 0; font-size: 13.5px; color: var(--text-secondary); max-width: 480px; margin: 0 auto;">Saat ini belum ada barang yang sedang dilelang di pasar galaksi. Pasang komoditas atau relik pertamamu lewat perintah <code>/survival auction create</code> di Discord!</p>
          </div>
        `;
      }

      function setCategory(cat, ev) {
        activeCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (ev && ev.currentTarget) {
          ev.currentTarget.classList.add('active');
        } else if (event && event.currentTarget) {
          event.currentTarget.classList.add('active');
        }
        renderMarketItems();
      }

      function filterMarket() {
        renderMarketItems();
      }

      window.addEventListener('DOMContentLoaded', loadMarketplace);
    </script>
  </body>
</html>
