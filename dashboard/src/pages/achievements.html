<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trophy Room & 34 Achievements | Naura OS</title>
    <meta name="description" content="Koleksi 34 medali kehormatan, lencana langka, dan gelar prestisius petualang Naura Wilds." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;900&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/src/css/stellar.css" />
    <style>
      .trophy-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }
      .trophy-hero {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, rgba(244, 114, 182, 0.06) 100%);
        border: 1px solid var(--border-medium);
        border-radius: var(--r-xl);
        padding: 28px;
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        box-shadow: var(--glass-specular, inset 0 1px 0 0 rgba(255, 255, 255, 0.08));
      }
      .progress-bar-bg {
        width: 100%;
        height: 10px;
        background: rgba(255,255,255,0.08);
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 8px;
      }
      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #F59E0B, #F472B6);
        border-radius: 9999px;
        transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .trophy-filter-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }
      .trophy-pill-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .filter-pill {
        padding: 6px 14px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-secondary, #9ca3af);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .filter-pill:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
      }
      .filter-pill.active {
        background: rgba(244, 114, 182, 0.15);
        border-color: rgba(244, 114, 182, 0.4);
        color: var(--primary, #f472b6);
      }
      .trophy-search {
        position: relative;
        min-width: 220px;
      }
      .trophy-search input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 12px 7px 32px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
        font-size: 12px;
        outline: none;
      }
      .trophy-search input:focus {
        border-color: var(--primary, #f472b6);
      }
      .trophy-search i {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 12px;
        color: #6b7280;
      }
      .trophy-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
      }
      .trophy-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-lg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: transform var(--t-base, 200ms) var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)), border-color var(--t-base, 200ms ease), box-shadow var(--t-base, 200ms ease);
        box-shadow: var(--glass-specular, inset 0 1px 0 0 rgba(255, 255, 255, 0.06));
      }
      .trophy-card:hover {
        transform: translateY(-3px);
        border-color: var(--primary, #f472b6);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      }
      .trophy-card.locked {
        opacity: 0.55;
        background: rgba(255, 255, 255, 0.015);
      }
      .trophy-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .trophy-icon {
        font-size: 26px;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .trophy-rarity {
        font-family: var(--font-mono, monospace);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 9999px;
      }
      .rarity-mythic {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.4);
      }
      .rarity-rare {
        background: rgba(192, 132, 252, 0.15);
        color: #d8b4fe;
        border: 1px solid rgba(192, 132, 252, 0.4);
      }
      .rarity-common {
        background: rgba(52, 211, 153, 0.12);
        color: #86efac;
        border: 1px solid rgba(52, 211, 153, 0.3);
      }
      .trophy-title {
        margin: 0;
        font-size: 15px;
        font-family: var(--font-heading);
        color: #ffffff;
      }
      .trophy-desc {
        margin: 0;
        font-size: 12.5px;
        color: var(--text-secondary);
        line-height: 1.5;
        flex: 1;
      }
      .trophy-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 4px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 11.5px;
        font-weight: 700;
      }
      .status-ok {
        color: #10B981;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .status-lock {
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .trophy-reward {
        font-family: var(--font-mono, monospace);
        font-size: 11px;
        color: #F59E0B;
        display: flex;
        align-items: center;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <a href="#mainContent" class="skip-link">Lewati ke konten utama</a>
    <div id="shared-nav"></div>

    <main class="trophy-container" id="mainContent">
      <section class="trophy-hero">
        <div style="flex:1; min-width:280px;">
          <h1 style="margin:0 0 6px; font-size:26px; font-family:var(--font-heading); display:flex; align-items:center; gap:10px;">
            <i class="fa-solid fa-trophy" style="color:#f59e0b;"></i> Ruang Trofi & 34 Pencapaian Langka
          </h1>
          <p style="margin:0; color:var(--text-secondary); font-size:14px;">Koleksi lengkap medali kehormatan, lencana langka, dan gelar prestisius petualang Naura Wilds.</p>
          <div style="margin-top:14px;">
            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); font-family:var(--font-mono);">
              <span>PROGRES PENCAPAIAN</span>
              <span style="color:#F59E0B;" id="progressRatioText">0 / 34 TERBUKA (0%)</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
            </div>
          </div>
        </div>
        <div>
          <a href="/profile" class="btn btn-primary btn-sm" style="min-height:44px; padding:0 18px; display:inline-flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-id-card"></i> Lihat di Profil Lengkap
          </a>
        </div>
      </section>

      <section class="trophy-filter-bar">
        <div class="trophy-pill-group">
          <button type="button" class="filter-pill active" data-filter="all">Semua (34)</button>
          <button type="button" class="filter-pill" data-filter="unlocked">Terbuka</button>
          <button type="button" class="filter-pill" data-filter="locked">Terkunci</button>
          <button type="button" class="filter-pill" data-filter="mythic">Mitos</button>
          <button type="button" class="filter-pill" data-filter="rare">Langka</button>
        </div>

        <div class="trophy-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="achSearchInput" placeholder="Cari pencapaian..." />
        </div>
      </section>

      <section class="trophy-grid" id="trophyGrid">
        <div style="grid-column:1/-1; text-align:center; padding:40px 20px; color:var(--text-muted);">
          <i class="fa-solid fa-spinner fa-spin" style="font-size:24px; color:var(--primary); margin-bottom:10px;"></i>
          <div>Menyinkronkan 34 trofi pencapaian dari database...</div>
        </div>
      </section>
    </main>

    <script src="/src/js/sharedNav.js"></script>
    <script src="/js/theme-switcher.js"></script>
    <script src="/js/pwa-install.js"></script>
    <script>
      (function() {
        'use strict';
        let allAchievements = [];
        let activeFilter = 'all';
        let searchQuery = '';

        async function fetchAchievements() {
          try {
            const res = await fetch('/api/achievements');
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Gagal memuat data');

            allAchievements = data.achievements || [];
            const ratioText = data.unlockedCount + ' / ' + data.total + ' TERBUKA (' + data.percentage + '%)';
            document.getElementById('progressRatioText').textContent = ratioText;
            document.getElementById('progressBarFill').style.width = data.percentage + '%';

            renderGrid();
          } catch (e) {
            console.error('Error fetching achievements:', e);
            document.getElementById('trophyGrid').innerHTML = `
              <div style="grid-column:1/-1; text-align:center; padding:36px; color:#f87171;">
                <i class="fa-solid fa-triangle-exclamation" style="font-size:24px; margin-bottom:8px;"></i>
                <div>Gagal memuat katalog pencapaian. Silakan muat ulang halaman.</div>
              </div>
            `;
          }
        }

        function formatEmoji(raw) {
          if (!raw) return '<i class="fa-solid fa-trophy"></i>';
          const match = String(raw).match(/<a?:([a-zA-Z0-9_]+):(\d+)>/);
          if (match) {
            const isAnimated = String(raw).startsWith('<a:');
            const ext = isAnimated ? 'gif' : 'webp';
            return '<img src="https://cdn.discordapp.com/emojis/' + match[2] + '.' + ext + '?size=64&quality=lossless" alt="' + match[1] + '" style="width:26px;height:26px;object-fit:contain;vertical-align:middle;" onerror="this.outerHTML=\'🏆\'" />';
          }
          return raw;
        }

        function renderGrid() {
          const container = document.getElementById('trophyGrid');
          if (!container) return;

          const filtered = allAchievements.filter((ach) => {
            if (activeFilter === 'unlocked' && !ach.unlocked) return false;
            if (activeFilter === 'locked' && ach.unlocked) return false;
            if (activeFilter === 'mythic' && ach.rarity !== 'Mythic') return false;
            if (activeFilter === 'rare' && ach.rarity !== 'Rare') return false;

            if (searchQuery) {
              const q = searchQuery.toLowerCase();
              return ach.title.toLowerCase().includes(q) || ach.description.toLowerCase().includes(q);
            }
            return true;
          });

          if (filtered.length === 0) {
            container.innerHTML = `
              <div style="grid-column:1/-1; text-align:center; padding:36px; color:var(--text-muted);">
                <i class="fa-solid fa-circle-question" style="font-size:24px; margin-bottom:8px;"></i>
                <div>Tidak ada pencapaian yang cocok dengan filter.</div>
              </div>
            `;
            return;
          }

          container.innerHTML = filtered.map((ach) => {
            const isLocked = !ach.unlocked;
            const rarityClass = 'rarity-' + ach.rarity.toLowerCase();
            const rarityLabel = ach.rarity === 'Mythic' ? 'Mitos' : (ach.rarity === 'Rare' ? 'Langka' : 'Umum');

            let rewardHtml = '';
            if (ach.rarity === 'Mythic') {
              rewardHtml = '<span class="trophy-reward"><i class="fa-solid fa-ticket"></i> +3 Kupon</span>';
            } else if (ach.rarity === 'Rare') {
              rewardHtml = '<span class="trophy-reward"><i class="fa-solid fa-ticket"></i> +1 Kupon</span>';
            }

            return `
              <div class="trophy-card ${isLocked ? 'locked' : ''}">
                <div class="trophy-card-header">
                  <div class="trophy-icon" style="color:${ach.color || '#f472b6'};">
                    ${formatEmoji(ach.emoji)}
                  </div>
                  <span class="trophy-rarity ${rarityClass}">${rarityLabel}</span>
                </div>
                <div>
                  <h3 class="trophy-title">${ach.title}</h3>
                  <p class="trophy-desc">${ach.description}</p>
                </div>
                <div class="trophy-card-footer">
                  ${ach.unlocked
                    ? '<span class="status-ok"><i class="fa-solid fa-check"></i> TERBUKA</span>'
                    : '<span class="status-lock"><i class="fa-solid fa-lock"></i> TERKUNCI</span>'
                  }
                  ${rewardHtml}
                </div>
              </div>
            `;
          }).join('');
        }

        // Filter buttons
        document.querySelectorAll('.filter-pill').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-pill').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            activeFilter = btn.dataset.filter || 'all';
            renderGrid();
          });
        });

        // Search input
        document.getElementById('achSearchInput')?.addEventListener('input', (e) => {
          searchQuery = e.target.value.trim();
          renderGrid();
        });

        fetchAchievements();
      })();
    </script>
  </body>
</html>
