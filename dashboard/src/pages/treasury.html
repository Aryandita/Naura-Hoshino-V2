<!doctype html>
<html lang="id" data-pillar="kontrol">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kas Server Treasury | Naura OS</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;900&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/src/css/stellar.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <style>
      .treasury-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 8px 0 64px;
      }
      .treasury-hero {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.14) 0%, rgba(34, 211, 238, 0.08) 100%);
        border: 1px solid var(--border-medium);
        border-radius: var(--r-xl);
        padding: 24px 28px;
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }
      .treasury-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
        margin: 20px 0;
      }
      .treasury-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-lg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }
      .treasury-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent-cyan);
      }
      .treasury-card h3 {
        margin: 0;
        font-size: 14px;
        color: #86efac;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .treasury-card .value {
        font-family: var(--font-mono);
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
      }
      .treasury-card .pct {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-muted);
      }
      .treasury-bar {
        height: 8px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 6px;
      }
      .treasury-bar-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.6s ease;
      }
      .chart-wrap {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-xl);
        padding: 24px;
        margin-top: 24px;
      }
      .chart-canvas-box {
        position: relative;
        height: 280px;
        max-width: 520px;
        margin: 0 auto;
      }
      .pool-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }
      .pool-stat {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-lg);
        padding: 18px 20px;
        text-align: center;
      }
      .pool-stat .label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
      }
      .pool-stat .number {
        font-family: var(--font-mono);
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
      }
      .updated-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        padding: 6px 14px;
        background: rgba(34, 211, 238, 0.1);
        border: 1px solid rgba(34, 211, 238, 0.3);
        border-radius: 999px;
        font-size: 12px;
        color: #22d3ee;
      }
      .error-msg {
        color: #f87171;
        padding: 16px;
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.25);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div id="shared-nav"></div>
    <main class="treasury-container">
      <header class="treasury-hero">
        <div>
          <h1 style="margin: 0 0 6px; font-family: var(--font-heading); font-size: 24px; color: #fff;">
            <i class="fa-solid fa-vault" style="color: #34d399; margin-right: 8px;"></i> Kas Server Treasury
          </h1>
          <p style="margin: 0; color: var(--text-secondary); font-size: 13.5px;">
            Transparansi alokasi kas server Naura Hoshino V2 (Sirkulasi Ekonomi Tertutup V2)
          </p>
        </div>
        <div style="display: flex; gap: 10px;">
          <a href="/economy" class="btn btn-secondary btn-sm"><i class="fa-solid fa-coins"></i> Halaman Ekonomi</a>
          <a href="/marketplace" class="btn btn-ghost btn-sm"><i class="fa-solid fa-shop"></i> Balai Lelang</a>
        </div>
      </header>

      <div id="treasuryLoading" class="pool-stat">
        <div class="label">Memuat Data Kas Server</div>
        <div class="number">...</div>
      </div>

      <div id="treasuryError" class="error-msg" style="display:none;"></div>

      <div id="treasuryContent" style="display:none;">
        <div class="pool-stats" id="poolStats"></div>

        <div class="treasury-grid" id="allocationGrid"></div>

        <div class="chart-wrap">
          <h3 style="margin: 0 0 16px 0; font-family: var(--font-heading); font-size: 16px; color: #ffffff;">
            <i class="fa-solid fa-chart-pie" style="color: #22d3ee; margin-right: 8px;"></i> Proporsi 4 Saluran Kas Server
          </h3>
          <div class="chart-canvas-box">
            <canvas id="treasuryChart"></canvas>
          </div>
        </div>

        <div id="treasuryUpdated" class="updated-badge"></div>
      </div>
    </main>
    <script src="/src/js/sharedNav.js"></script>
    <script>
      const API_BASE = '/api/treasury';
      const COLORS = { moss: '#34D399', amber: '#FBBF24', emerald: '#86EFAC', danger: '#F87171' };
      function fmt(n) { return Number(n || 0).toLocaleString('id-ID'); }
      async function fetchTreasury() {
        const loading = document.getElementById('treasuryLoading');
        const error = document.getElementById('treasuryError');
        const content = document.getElementById('treasuryContent');
        try {
          const res = await fetch(`${API_BASE}/summary`);
          const data = await res.json();
          if (!data.success) throw new Error(data.error || 'Gagal memuat');
          loading.style.display = 'none';
          error.style.display = 'none';
          content.style.display = 'block';
          const poolStats = document.getElementById('poolStats');
          poolStats.innerHTML = `
            <div class="pool-stat"><div class="label">Dompet Server (NC)</div><div class="number">${fmt(data.pools_nc.total_wallet)}</div></div>
            <div class="pool-stat"><div class="label">Bank Server (NC)</div><div class="number">${fmt(data.pools_nc.total_bank)}</div></div>
            <div class="pool-stat"><div class="label">Star Fragments (NSF)</div><div class="number">${fmt(data.pools_nsf.total_star_fragments)}</div></div>
            <div class="pool-stat"><div class="label">Total Treasury (NSF)</div><div class="number" style="color:${COLORS.amber};">${fmt(data.pools_nsf.treasury_total)}</div></div>
          `;
          const grid = document.getElementById('allocationGrid');
          const alloc = data.allocation;
          const order = ['infrastructure', 'lottery', 'subsidy', 'merchant'];
          grid.innerHTML = order.map(key => {
            const a = alloc[key];
            const color = a.color || COLORS.moss;
            return `
              <div class="treasury-card">
                <h3>${a.label} <span class="pct">${a.pct}%</span></h3>
                <div class="value">${fmt(a.value)} NSF</div>
                <div class="treasury-bar"><div class="treasury-bar-fill" style="width:0%; background:${color};" data-pct="${a.pct}"></div></div>
              </div>
            `;
          }).join('');
          setTimeout(() => { document.querySelectorAll('.treasury-bar-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; }); }, 100);
          if (typeof Chart !== 'undefined') {
            const ctx = document.getElementById('treasuryChart').getContext('2d');
            const values = order.map(k => Math.max(1, Number(alloc[k].value) || Number(alloc[k].pct) || 1));
            new Chart(ctx, {
              type: 'doughnut',
              data: {
                labels: order.map(k => `${alloc[k].label} (${alloc[k].pct}%)`),
                datasets: [{
                  data: values,
                  backgroundColor: order.map(k => alloc[k].color || COLORS.moss),
                  borderWidth: 0,
                  hoverOffset: 6
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { position: 'bottom', labels: { color: '#e2e8f0', font: { size: 12 } } },
                  title: { display: false }
                },
                cutout: '68%'
              }
            });
          }
          const badge = document.getElementById('treasuryUpdated');
          badge.innerHTML = '<i class="fa-solid fa-clock"></i> Terakhir diperbarui: ' + new Date(data.updatedAt || Date.now()).toLocaleString('id-ID');
        } catch (err) {
          loading.style.display = 'none';
          error.style.display = 'block';
          error.textContent = 'Gagal memuat data treasury. Coba lagi nanti.';
          console.error(err);
        }
      }
      document.addEventListener('DOMContentLoaded', fetchTreasury);
    </script>
  </body>
</html>
