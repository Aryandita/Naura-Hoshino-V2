<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  
    <defs>
      <!-- Base Gradients Sesuai Token Resmi -->
      <linearGradient id="gradient-skin" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFB6C1" />
        <stop offset="100%" stop-color="#FFC0CB" />
      </linearGradient>

      <linearGradient id="gradient-skin-dark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFB6C1" />
        <stop offset="100%" stop-color="#FFA0B0" />
      </linearGradient>

      <linearGradient id="gradient-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00FFFF" />
        <stop offset="100%" stop-color="#00C4D6" />
      </linearGradient>

      <linearGradient id="gradient-magic" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#C084FC" />
        <stop offset="100%" stop-color="#9333EA" />
      </linearGradient>

      <linearGradient id="gradient-nature" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#22C55E" />
        <stop offset="100%" stop-color="#4ADE80" />
      </linearGradient>

      <linearGradient id="gradient-amber" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF7CC" />
        <stop offset="50%" stop-color="#FFD700" />
        <stop offset="100%" stop-color="#B8860B" />
      </linearGradient>

      <linearGradient id="gradient-gold-plate" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF9D6" />
        <stop offset="40%" stop-color="#FFD700" />
        <stop offset="100%" stop-color="#B8860B" />
      </linearGradient>

      <linearGradient id="gradient-platinum" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="50%" stop-color="#E2E8F0" />
        <stop offset="100%" stop-color="#94A3B8" />
      </linearGradient>

      <linearGradient id="gradient-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF69B4" />
        <stop offset="100%" stop-color="#DB2777" />
      </linearGradient>

      <linearGradient id="gradient-alert" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF6B6B" />
        <stop offset="100%" stop-color="#DC2626" />
      </linearGradient>

      <linearGradient id="gradient-glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
      </linearGradient>

      <linearGradient id="gradient-dark-glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
        <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
      </linearGradient>

      <linearGradient id="gradient-blade" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="50%" stop-color="#00FFFF" />
        <stop offset="100%" stop-color="#C084FC" />
      </linearGradient>

      <!-- Radial Glow & Blush Gradients -->
      <radialGradient id="gradient-blush" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FF69B4" stop-opacity="0.5" />
        <stop offset="60%" stop-color="#FF69B4" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#FF69B4" stop-opacity="0" />
      </radialGradient>

      <radialGradient id="gradient-cyan-bloom" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.6" />
        <stop offset="70%" stop-color="#00FFFF" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#00FFFF" stop-opacity="0" />
      </radialGradient>

      <radialGradient id="gradient-magic-bloom" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#C084FC" stop-opacity="0.6" />
        <stop offset="70%" stop-color="#C084FC" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
      </radialGradient>

      <!-- Soft Glow Filters (Skia Compatible) -->
      <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  
  
    <!-- Lyric Lines Background -->
    <rect x="28" y="44" width="46" height="5" rx="2.5" fill="#9CA3AF" opacity="0.6" />
    <rect x="28" y="60" width="54" height="5" rx="2.5" fill="#C084FC" opacity="0.8" />
    <rect x="28" y="76" width="38" height="5" rx="2.5" fill="#9CA3AF" opacity="0.6" />
    <!-- 3D Glass Eighth Note -->
    <g transform="translate(0, 0)">
      <path d="M 78 72 L 78 38 L 98 32 L 98 44 L 78 50" fill="#00FFFF" filter="url(#glow-cyan)" />
      <ellipse cx="72" cy="74" rx="8" ry="6" fill="#00FFFF" transform="rotate(-20 72 74)" />
      <ellipse cx="94" cy="66" rx="8" ry="6" fill="#00FFFF" transform="rotate(-20 94 66)" />
    </g>
    <!-- Sparkle on Note -->
    <path d="M 98 26 Q 99.056 30.944 104 32 Q 99.056 33.056 98 38 Q 96.944 33.056 92 32 Q 96.944 30.944 98 26 Z" fill="#FFD700"  />
  
</svg>